<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This viewport meta tag is crucial for responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Club Collective</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <!-- Google Fonts for a modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* CSS for styling the page */
        :root {
            --primary-color: #00aaff;
            --text-color: #ffffff;
            --card-bg: rgba(0, 0, 0, 0.4);
            --dark-bg: #1a1a2e;
            --header-height: 70px; /* Adjusted for better mobile view */
            --footer-height: 50px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            overflow-x: hidden; /* Prevent horizontal scroll */
        }

        body {
            background: linear-gradient(-45deg, #232526, #414345, #232526, #414345);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            transition: background 0.8s ease-in-out;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        /* --- Loader Styles --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        /* --- End Loader Styles --- */

        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            cursor: pointer;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .site-header h1 {
            margin: 0;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-align: center;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: var(--header-height) 20px var(--footer-height);
            box-sizing: border-box;
            transition: padding-top 0.5s ease;
        }

        .club-nav {
            transition: all 0.5s ease-in-out;
            width: 100%;
            position: relative;
        }

        .club-nav ul {
            list-style: none;
            padding: 0;
            margin: 30px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            transition: all 0.5s ease-in-out;
            flex-wrap: wrap; /* Allow buttons to wrap on smaller screens */
        }

        .club-nav a {
            text-decoration: none;
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 12px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            display: inline-block; /* Ensure proper padding and borders */
        }

        .club-nav a:hover, .club-nav a.active {
            background-color: var(--primary-color);
            transform: translateY(-3px);
            border-color: var(--primary-color);
        }
        
        .initial-message {
            padding: 40px;
            transition: opacity 0.4s ease-out, transform 0.5s ease-in-out, height 0.5s ease;
        }
        
        body.viewing-club .initial-message {
            opacity: 0;
            transform: scale(0.9);
            height: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        body.viewing-club .club-nav {
            position: fixed;
            top: var(--header-height);
            left: 0;
            background-color: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(5px);
            padding: 10px 0;
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        body.viewing-club .club-nav ul {
            margin: 0;
            flex-wrap: nowrap;
            overflow-x: auto;
            white-space: nowrap;
            justify-content: flex-start;
            padding: 0 20px; /* Add padding for horizontal scroll */
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        body.viewing-club .club-nav ul::-webkit-scrollbar {
            display: none; /* Hide scrollbar for Chrome, Safari and Opera */
        }

        body.viewing-club .club-nav a {
            padding: 8px 18px;
            font-size: 0.9em;
        }

        body.viewing-club .main-container {
             /* Adjust padding for fixed nav height */
            padding-top: calc(var(--header-height) + 80px);
        }

        .contact-card {
            display: none;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 1100px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.5s ease-out 0.2s, transform 0.5s ease-out 0.2s;
            box-sizing: border-box;
        }
        
        .contact-card.visible { 
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        
        .initial-message h2 {
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .card-layout { display: flex; gap: 20px; }
        .left-panel { flex: 0 0 300px; display: flex; flex-direction: column; align-items: center; }
        .right-panel { flex: 1; min-width: 0; }
        
        .club-header {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            padding-bottom: 20px; margin-bottom: 20px; width: 100%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .club-logo {
            width: 120px; height: 120px; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--primary-color); flex-shrink: 0;
        }
        .club-bio {
            text-align: center;
            font-size: 0.9em;
            color: var(--text-color);
            opacity: 0.8;
        }

        .main-content-container {
            height: 100%;
            max-height: calc(100vh - var(--header-height) - var(--footer-height) - 150px); /* Adjusted for better fit */
            overflow-y: auto;
            padding-right: 15px;
        }

        /* Custom Scrollbar */
        .main-content-container::-webkit-scrollbar { width: 5px; }
        .main-content-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .main-content-container::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }

        .section-title {
            font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--primary-color);
            margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;
            text-align: left;
        }

        .official-card, .event-card {
            background-color: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 10px;
            margin-bottom: 15px; text-align: left; opacity: 0; transform: translateY(20px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .official-card.is-visible, .event-card.is-visible { opacity: 1; transform: translateY(0); }
        .official-card { display: flex; align-items: center; gap: 15px; }
        .official-photo {
            width: 60px; height: 60px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2); flex-shrink: 0;
        }
        .official-details { flex-grow: 1; }
        .official-details h4 { margin: 0 0 2px 0; }
        .official-details strong {
            color: var(--primary-color); font-weight: 600; display: block;
            font-size: 0.8em; text-transform: uppercase;
        }
        .official-bio {
            font-size: 0.85em; line-height: 1.5; margin: 8px 0 12px 0;
            color: var(--text-color); opacity: 0.8;
        }
        .official-social-icons { display: flex; gap: 15px; align-items: center; }
        .official-social-icons a { color: var(--text-color); opacity: 0.8; font-size: 1.2em; transition: all 0.2s; }
        .official-social-icons a:hover { transform: scale(1.15); opacity: 1; }
        .fa-linkedin:hover { color: #0A66C2; }
        .fa-envelope:hover { color: #f2a60c; }
        .fa-phone:hover { color: #66d9ff; }
        .fa-whatsapp:hover { color: #25D366; }

        .event-card { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        .event-title { font-weight: 600; }
        .event-date { font-style: italic; font-size: 0.9em; color: var(--text-color); opacity: 0.8; white-space: nowrap; }

        .club-social-links {
            padding-top: 20px; 
            margin-top: 20px;
            width: 100%;
        }
        .club-social-icons { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .club-social-icons a {
            color: var(--text-color); text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 15px; border-radius: 25px; background-color: rgba(255, 255, 255, 0.1);
            transition: all 0.3s; width: 100%; box-sizing: border-box; justify-content: center;
        }
        .club-social-icons a:hover { background-color: var(--primary-color); transform: translateY(-2px); }
        .club-social-icons span { font-size: 0.8em; }
        .club-social-icons i { font-size: 1.4em; }

        .site-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--footer-height);
            display: flex; justify-content: center; align-items: center;
            background-color: rgba(26, 26, 46, 0.8); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1); font-size: 0.8em; color: #aaa; z-index: 1000;
            text-align: center;
            padding: 0 15px;
        }
        
        /* ================================== */
        /* == RESPONSIVE MEDIA QUERIES == */
        /* ================================== */

        @media (max-width: 992px) {
            .card-layout {
                flex-direction: column; /* Stack left and right panels */
                gap: 30px;
            }

            .left-panel {
                flex: 1 1 auto; /* Allow panel to grow and shrink */
                width: 100%;
            }

            .main-content-container {
                /* On mobile, let the card scroll with the page, not internally */
                max-height: none;
                overflow-y: visible;
                padding-right: 0;
            }

            .club-bio {
                text-align: center;
            }
        }

        @media (max-width: 768px) {
            :root {
                --header-height: 60px;
            }
            .site-header h1 {
                font-size: 1em;
            }
            
            .club-nav a {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .official-card {
                flex-direction: column; /* Stack photo and details on small screens */
                align-items: center;
                text-align: center;
            }
            
            .official-social-icons {
                justify-content: center; /* Center icons below bio */
            }

            .event-card {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
    </div>
    <div id="particles-js"></div>
    <header class="site-header" id="site-header">
        <h1>MAKERSPACE</h1>
    </header>
    <div class="main-container" id="main-container">
        <div class="initial-message" id="initial-message">
            <h1>SELECT A CLUB</h1>
        </div>
        <nav class="club-nav" id="club-nav">
            <ul>
                <li><a href="#" class="club-link" data-club="build_club">BUILD CLUB</a></li>
                <li><a href="#" class="club-link" data-club="aerodrone">AERODRONE</a></li>
                <li><a href="#" class="club-link" data-club="stem">STEM</a></li>
                <li><a href="#" class="club-link" data-club="we_impact">WE IMPACT</a></li>
            </ul>
        </nav>
        <div class="contact-card" id="contact-card"></div>
    </div>
    <footer class="site-footer">
        <p>&copy; 2025 All Rights Reserved.</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('loader');

            function showLoader() {
                loader.classList.remove('hidden');
            }

            function hideLoader() {
                loader.classList.add('hidden');
            }
            
            // Initialize particles.js
            particlesJS("particles-js", {
                particles: {
                    number: { value: 60, density: { enable: true, value_area: 800 } },
                    color: { value: "#ffffff" },
                    shape: { type: "circle" },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    line_linked: { enable: true, distance: 150, color: "#ffffff", opacity: 0.4, width: 1 },
                    move: {
                        enable: true,
                        speed: 1.5,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: { onhover: { enable: true, mode: "repulse" }, onclick: { enable: true, mode: "push" }, resize: true },
                    modes: {
                        repulse: { distance: 100, duration: 0.4 },
                        push: { particles_nb: 4 }
                    }
                },
                retina_detect: true
            });
            
            // Hide loader once particles are initialized (or shortly after)
            setTimeout(hideLoader, 500);


            // --- SCRIPT LOGIC ---
            const clubLinks = document.querySelectorAll('.club-link');
            const contactCard = document.getElementById('contact-card');
            const siteHeader = document.getElementById('site-header');
            
            let currentClubId = null;
            const clubDataCache = {}; // Cache to store fetched data

            const scrollObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            function renderClubInfo(clubId, data) {
                if (!data) return;

                document.documentElement.style.setProperty('--primary-color', data.primaryColor);
                document.documentElement.style.setProperty('--text-color', data.textColor);
                document.body.style.background = data.theme;
                document.body.style.backgroundSize = '400% 400%';
                document.body.style.animation = 'gradientBG 15s ease infinite';
                document.body.classList.add('viewing-club');

                const defaultWhatsappMsg = encodeURIComponent("I'm contacting you from the webpage.");

                const leftPanelHtml = `
                    <div class="left-panel">
                        <div class="club-header">
                            <img src="${data.clubImage}" alt="${clubId} Logo" class="club-logo" onerror="this.onerror=null;this.src='https.placehold.co/120x120/333/efefef?text=Error';">
                            <div class="club-bio"><p>${data.clubBio}</p></div>
                        </div>
                        <div class="club-social-links">
                            <h3 class="section-title">Connect</h3>
                            <div class="club-social-icons">
                                <a href="${data.links.whatsapp}" target="_blank"><i class="fab fa-whatsapp"></i><span>WhatsApp</span></a>
                                <a href="${data.links.instagram}" target="_blank"><i class="fab fa-instagram"></i><span>Instagram</span></a>
                                <a href="${data.links.linkedin}" target="_blank"><i class="fab fa-linkedin"></i><span>LinkedIn</span></a>
                                <a href="${data.links.email}"><i class="fas fa-envelope"></i><span>Email</span></a>
                            </div>
                        </div>
                    </div>`;

                const officialsHtml = `
                    <h3 class="section-title">Our Team</h3>
                    ${data.officials.map(p => {
                        const hasContact = p.contact && p.contact.toLowerCase() !== 'n/a';
                        const phoneLink = hasContact ? `tel:${p.contact}` : '#';
                        const whatsappLink = hasContact ? `https://wa.me/${p.contact}?text=${defaultWhatsappMsg}` : '#';

                        return `
                            <div class="official-card">
                                <img src="${p.photo}" alt="${p.name}" class="official-photo" onerror="this.onerror=null;this.src='https.placehold.co/60x60/333/efefef?text=:)';">
                                <div class="official-details">
                                    <h4>${p.name}</h4>
                                    <strong>${p.position}</strong>
                                    <p class="official-bio">${p.bio}</p>
                                    <div class="official-social-icons">
                                        ${hasContact ? `<a href="${phoneLink}" title="Call"><i class="fas fa-phone"></i></a>` : ''}
                                        ${hasContact ? `<a href="${whatsappLink}" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>` : ''}
                                        <a href="${p.social.linkedin}" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
                                        <a href="${p.social.email}" title="Email"><i class="fas fa-envelope"></i></a>
                                    </div>
                                </div>
                            </div>`;
                    }).join('')}`;

                const eventsHtml = `
                    <h3 class="section-title">Upcoming Events</h3>
                    ${data.events.map(event => `
                        <div class="event-card">
                            <span class="event-title">${event.title}</span>
                            <span class="event-date">${event.date}</span>
                        </div>`).join('')}`;

                const rightPanelHtml = `
                    <div class="right-panel">
                        <div class="main-content-container">
                            ${officialsHtml}
                            ${eventsHtml}
                        </div>
                    </div>`;

                contactCard.innerHTML = `<div class="card-layout">${leftPanelHtml}${rightPanelHtml}</div>`;
                document.querySelectorAll('.official-card, .event-card').forEach(el => scrollObserver.observe(el));

                setTimeout(() => {
                    contactCard.classList.add('visible');
                    hideLoader(); // Hide loader after content is ready
                }, 10);
            }

            function hideClubInfo() {
                document.body.classList.remove('viewing-club');
                contactCard.classList.remove('visible');
                setTimeout(() => {
                    if (!document.body.classList.contains('viewing-club')) {
                        document.body.style.background = 'linear-gradient(-45deg, #232526, #414345, #232526, #414345)';
                        document.body.style.backgroundSize = '400% 400%';
                        document.body.style.animation = 'gradientBG 15s ease infinite';
                        document.documentElement.style.setProperty('--primary-color', '#00aaff');
                        document.documentElement.style.setProperty('--text-color', '#ffffff');
                    }
                }, 500);
                clubLinks.forEach(l => l.classList.remove('active'));
                currentClubId = null;
            }

            clubLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const clubId = e.currentTarget.dataset.club;

                    if (clubId === currentClubId) return; // Do nothing if same club is clicked

                    showLoader(); // Show loader when a new club is selected
                    currentClubId = clubId;
                    clubLinks.forEach(l => l.classList.remove('active'));
                    e.currentTarget.classList.add('active');

                    // Check cache first
                    if (clubDataCache[clubId]) {
                        renderClubInfo(clubId, clubDataCache[clubId]);
                    } else {
                        // Fetch new data
                        fetch(`./data/${clubId}.json`)
                            .then(response => {
                                if (!response.ok) throw new Error(`Could not load ${clubId}.json`);
                                return response.json();
                            })
                            .then(data => {
                                clubDataCache[clubId] = data; // Store in cache
                                renderClubInfo(clubId, data);
                            })
                            .catch(error => {
                                console.error('Error fetching club data:', error);
                                contactCard.innerHTML = `<p style="color: var(--primary-color);">Could not load club information. Please try again later.</p>`;
                                contactCard.classList.add('visible');
                                hideLoader(); // Hide loader on error
                            });
                    }
                });
            });

            siteHeader.addEventListener('click', (e) => {
                if (e.target.tagName !== 'A') {
                    hideClubInfo();
                }
            });
        });
    </script>
</body>
</html>
