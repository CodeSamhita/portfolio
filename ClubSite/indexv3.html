<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maker Space - Home</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
    </div>
    <div id="particles-js"></div>

    <header class="site-header" id="site-header">
        <a href="indexv3.html" class="logo-container">
            <img src="image/logo.png" alt="MakerSpace Logo" class="logo-img">
            <h1>
                PRESIDENCY MAKERSPACE
            </h1>
        </a>    
        <nav class="main-nav">
            <ul>
                <li><a href="indexv3.html" class="active">Home</a></li>
                <li><a href="faculty.html">Faculty</a></li>
                <li><a href="team.html">Core Team</a></li>
                <li><a href="gallery.html">Gallery</a></li>
            </ul>
        </nav>
        <button class="nav-toggle" aria-label="toggle navigation">
            <span class="hamburger"></span>
        </button>
    </header>

    <div class="main-container" id="main-container">
        <div class="initial-message" id="initial-message">
            <h1>CLICK TO VIEW/JOIN A CLUB</h1>
        </div>
        <nav class="club-nav" id="club-nav">
            <ul>
                <li><a href="#" class="club-link" data-club="build_club">BUILD CLUB</a></li>
                <li><a href="#" class="club-link" data-club="humanoid">HUMANOID CLUB</a></li>              
                <li><a href="#" class="club-link" data-club="aerodrone">AERODRONE CLUB</a></li>
                <li><a href="#" class="club-link" data-club="stem">STEM CLUB</a></li>
                <li><a href="#" class="club-link" data-club="we_impact">WE IMPACT CLUB</a></li>
            </ul>
        </nav>
        <div class="contact-card" id="contact-card"></div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2025 All Rights Reserved.</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="js/main.js" defer></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const loader = document.getElementById('loader');
        function showLoader() { loader.classList.remove('hidden'); }
        function hideLoader() { loader.classList.add('hidden'); }
        
        setTimeout(hideLoader, 500);

        const clubLinks = document.querySelectorAll('.club-link');
        const contactCard = document.getElementById('contact-card');
        let currentClubId = null;
        const clubDataCache = {};

        clubLinks.forEach(link => {
            const clubId = link.dataset.club;
            if (clubId) {
                fetch(`./data/clubs/${clubId}.json`)
                    .then(response => response.ok ? response.json() : Promise.reject('File not found'))
                    .then(data => {
                        if (data.primaryColor) {
                            link.style.setProperty('--club-hover-color', data.primaryColor);
                        }
                    })
                    .catch(error => console.error(`Could not load color for ${clubId}:`, error));
            }
        });

        function renderClubInfo(clubId, data) {
            if (!data) return;

            document.documentElement.style.setProperty('--primary-color', data.primaryColor);
            document.body.style.background = data.theme;
            document.body.style.backgroundSize = '400% 400%';
            document.body.style.animation = 'gradientBG 15s ease infinite';
            document.body.classList.add('viewing-club');

            const socialButtonMap = {
                whatsapp: { icon: 'fab fa-whatsapp', text: 'WhatsApp' },
                instagram: { icon: 'fab fa-instagram', text: 'Instagram' },
                linkedin: { icon: 'fab fa-linkedin', text: 'LinkedIn' },
                youtube: { icon: 'fab fa-youtube', text: 'YouTube' },
                email: { icon: 'fas fa-envelope', text: 'Email' }
            };

            let clubSocialLinksHtml = '';
            if (data.links) {
                for (const [key, url] of Object.entries(data.links)) {
                    if (url && url.toLowerCase() !== 'n/a' && url.trim() !== '#') {
                        const linkInfo = socialButtonMap[key] || { icon: 'fas fa-link', text: key.charAt(0).toUpperCase() + key.slice(1) };
                        const linkHref = key === 'email' && !url.startsWith('mailto:') ? `mailto:${url}` : url;
                        clubSocialLinksHtml += `<a href="${linkHref}" target="_blank" class="${key}-btn"><i class="${linkInfo.icon}"></i><span>${linkInfo.text}</span></a>`;
                    }
                }
            }
            
            const leftPanelHtml = `<div class="left-panel"><div class="club-header"><img src="${data.clubImage}" alt="${clubId} Logo" class="club-logo" onerror="this.onerror=null;this.src='https://placehold.co/120x120/333/efefef?text=Error';"><div class="club-bio"><p>${data.clubBio}</p></div></div><div class="club-social-links"><h3 class="section-title">CONNECT</h3><div class="club-social-icons">${clubSocialLinksHtml}</div></div></div>`;
            
            const defaultWhatsappMsg = encodeURIComponent("Hey, I'm contacting you from the Makerspace portal.");
            const officialsHtml = `<h3 class="section-title">OUR TEAM</h3>${data.officials.map(p => {
                const hasContact = p.contact && p.contact.toString().toLowerCase() !== 'n/a';
                const phoneLink = hasContact ? `tel:${p.contact}` : '#';
                const whatsappLink = hasContact ? `https://wa.me/${p.contact.toString().replace(/[^0-9]/g, '')}?text=${defaultWhatsappMsg}` : '#';

                const socialIconsMap = { linkedin: 'fab fa-linkedin', email: 'fas fa-envelope', youtube: 'fab fa-youtube', github: 'fab fa-github', twitter: 'fab fa-x-twitter' };
                let socialIconsHtml = '';
                if (p.social) {
                    for (const [key, value] of Object.entries(p.social)) {
                        if (value && value.toLowerCase() !== 'n/a' && value.trim() !== '#') {
                            socialIconsHtml += `<a href="${value}" target="_blank" title="${key.charAt(0).toUpperCase() + key.slice(1)}"><i class="${socialIconsMap[key] || 'fas fa-link'}"></i></a>`;
                        }
                    }
                }
                return `<div class="official-card fade-in-on-scroll"><img src="${p.photo}" alt="${p.name}" class="official-photo" onerror="this.onerror=null;this.src='https://placehold.co/150x150/333/efefef?text=:)';"><div class="official-details"><h4>${p.name}</h4><strong>${p.position}</strong><p class="official-bio">${p.bio}</p><div class="official-social-icons">
                    ${hasContact ? `<a href="${phoneLink}" title="Call"><i class="fas fa-phone"></i></a>` : ''}
                    ${hasContact ? `<a href="${whatsappLink}" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>` : ''}
                    ${socialIconsHtml}
                </div></div></div>`;
            }).join('')}`;

            const eventsHtml = `<h3 class="section-title">UPCOMING EVENTS</h3>${data.events.map(event => `<div class="event-card fade-in-on-scroll"><span class="event-title">${event.title}</span><span class="event-date">${event.date}</span></div>`).join('')}`;

            const rightPanelHtml = `<div class="right-panel"><div class="main-content-container">${officialsHtml}${eventsHtml}</div></div>`;

            contactCard.innerHTML = `<div class="card-layout">${leftPanelHtml}${rightPanelHtml}</div>`;

            setTimeout(() => {
                contactCard.classList.add('visible');
                hideLoader();
            }, 10);
        }

        function hideClubInfo() {
            document.body.classList.remove('viewing-club');
            contactCard.classList.remove('visible');
            setTimeout(() => {
                if (!document.body.classList.contains('viewing-club')) {
                    document.body.style.background = 'linear-gradient(-45deg, #232526, #414345, #232526, #414345)';
                    document.body.style.backgroundSize = '400% 400%';
                    document.body.style.animation = 'gradientBG 15s ease infinite';
                    document.documentElement.style.setProperty('--primary-color', '#00aaff');
                }
            }, 500);
            clubLinks.forEach(l => l.classList.remove('active'));
            currentClubId = null;
        }

        clubLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const clubId = e.currentTarget.dataset.club;
                if (clubId === currentClubId) return;
                showLoader();
                currentClubId = clubId;
                clubLinks.forEach(l => l.classList.remove('active'));
                e.currentTarget.classList.add('active');

                if (clubDataCache[clubId]) {
                    renderClubInfo(clubId, clubDataCache[clubId]);
                } else {
                    fetch(`./data/clubs/${clubId}.json`)
                        .then(response => { if (!response.ok) throw new Error(`Could not load ${clubId}.json`); return response.json(); })
                        .then(data => { clubDataCache[clubId] = data; renderClubInfo(clubId, data); })
                        .catch(error => {
                            console.error('Error fetching club data:', error);
                            contactCard.innerHTML = `<p style="color: var(--primary-color);">Could not load club information.</p>`;
                            contactCard.classList.add('visible');
                            hideLoader();
                        });
                }
            });
        });
    });
    </script>
</body>
</html>
