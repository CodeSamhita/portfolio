<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maker Space - Core Team</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="particles-js"></div>

    <header class="site-header" id="site-header">
        <a href="index.html" class="logo-container">
            <img src="image/logo.png" alt="MakerSpace Logo" class="logo-img">
            <h1>PRESIDENCY MAKERSPACE</h1>
        </a>
        <nav class="main-nav">
            <ul>
                <li><a href="indexv3.html">Home</a></li>
                <li><a href="faculty.html">Faculty</a></li>
                <li><a href="team.html" class="active">Core Team</a></li>
                <li><a href="gallery.html">Gallery</a></li>
            </ul>
        </nav>
        <button class="nav-toggle" aria-label="toggle navigation">
            <span class="hamburger"></span>
        </button>
    </header>

    <div class="main-container" id="main-container">
        <div class="initial-message">
            <h1>Core Team</h1>
            <p>The student leaders dedicated to running the Makerspace community.</p>
        </div>
        <div id="team-groups">
            <div class="spinner"></div>
        </div>
    </div>

    <div id="whatsapp-modal" class="modal-overlay modal-hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-button">&times;</button>
            <h3>Contact via WhatsApp</h3>
            <p>Please provide your details to compose the message.</p>
            <form id="whatsapp-form">
                <div class="form-group">
                    <label for="user-name">Your Name:</label>
                    <input type="text" id="user-name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="contact-purpose">Purpose of Contact:</label>
                    <textarea id="contact-purpose" name="purpose" rows="3" required></textarea>
                </div>
                <div id="modal-error" class="error-message"></div>
                <div class="form-actions">
                    <button type="submit" class="button-primary">Compose Message</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2025 All Rights Reserved.</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="js/main.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const teamContainer = document.getElementById('team-groups');
            const modal = document.getElementById('whatsapp-modal');
            const closeModalBtn = document.getElementById('close-modal');
            const whatsappForm = document.getElementById('whatsapp-form');
            const modalError = document.getElementById('modal-error');
            let teamMemberWhatsappNumber = '';

            function showModal() {
                modal.classList.remove('modal-hidden');
            }
            function hideModal() {
                modal.classList.add('modal-hidden');
                whatsappForm.reset();
                modalError.textContent = '';
            }

            function createTeamMemberCard(member) {
                const socialIconsMap = { 
                    email: 'fas fa-envelope', 
                    contact: 'fas fa-phone',
                    whatsapp: 'fab fa-whatsapp',
                    linkedin: 'fab fa-linkedin', 
                    twitter: 'fab fa-twitter',
                    github: 'fab fa-github',
                    website: 'fas fa-globe'
                };
                
                let socialIconsHtml = '';

                function generateIconHtml(key, value) {
                    const iconClass = socialIconsMap[key] || 'fas fa-link';
                    const title = key.charAt(0).toUpperCase() + key.slice(1);
                    
                    if (key === 'whatsapp') {
                        return `<a href="#" class="whatsapp-contact-link" data-whatsapp-number="${value}" title="${title}"><i class="${iconClass}"></i></a>`;
                    } else {
                        let linkHref = value;
                        if (key === 'email' && !value.startsWith('mailto:')) linkHref = `mailto:${value}`;
                        else if (key === 'contact' && !value.startsWith('tel:')) linkHref = `tel:${value}`;
                        
                        return `<a href="${linkHref}" target="_blank" title="${title}"><i class="${iconClass}"></i></a>`;
                    }
                }

                if (member.social) {
                    const preferredOrder = ['email', 'whatsapp', 'contact'];
                    const socialLinks = { ...member.social };

                    preferredOrder.forEach(key => {
                        const value = socialLinks[key];
                        if (value && value.toLowerCase() !== 'n/a' && value.trim() !== '#') {
                            socialIconsHtml += generateIconHtml(key, value);
                            delete socialLinks[key];
                        }
                    });

                    for (const key in socialLinks) {
                        const value = socialLinks[key];
                        if (value && value.toLowerCase() !== 'n/a' && value.trim() !== '#') {
                            socialIconsHtml += generateIconHtml(key, value);
                        }
                    }
                }

                return `
                    <div class="official-card fade-in-on-scroll">
                        <img src="${member.photo}" alt="${member.name}" class="official-photo" onerror="this.onerror=null;this.src='https.placehold.co/150x150/333/efefef?text=${member.name.charAt(0)}';">
                        <div class="official-details">
                            <h4>${member.name}</h4>
                            <strong>${member.position}</strong>
                            <p class="official-bio">${member.bio}</p>
                            <div class="official-social-icons">${socialIconsHtml}</div>
                        </div>
                    </div>`;
            }
            
            teamContainer.addEventListener('click', (e) => {
                const link = e.target.closest('.whatsapp-contact-link');
                if (link) {
                    e.preventDefault();
                    teamMemberWhatsappNumber = link.dataset.whatsappNumber;
                    showModal();
                }
            });

            whatsappForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const userName = document.getElementById('user-name').value.trim();
                const contactPurpose = document.getElementById('contact-purpose').value.trim();

                if (!userName || !contactPurpose) {
                    modalError.textContent = 'Both fields are mandatory.';
                    return;
                }
                
                const message = `I'm reaching out to you from the maker space portal. My name is ${userName}. My purpose of contact is: ${contactPurpose}`;
                const encodedMessage = encodeURIComponent(message);
                const whatsappUrl = `https://wa.me/${teamMemberWhatsappNumber}?text=${encodedMessage}`;
                
                window.open(whatsappUrl, '_blank');
                hideModal();
            });

            closeModalBtn.addEventListener('click', hideModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    hideModal();
                }
            });

            fetch('./data/team/members.json')
                .then(response => { if (!response.ok) throw new Error('Network response was not ok'); return response.json(); })
                .then(data => {
                    let htmlContent = '';
                    if (!data.team_sections || data.team_sections.length === 0) {
                        teamContainer.innerHTML = '<p>No team information is available.</p>';
                        return;
                    }

                    data.team_sections.forEach(section => {
                        if (section.members && section.members.length > 0) {
                            htmlContent += `<h2 class="faculty-group-title">${section.section_name}</h2>`;
                            htmlContent += '<div class="content-grid">';
                            section.members.forEach(member => {
                                htmlContent += createTeamMemberCard(member);
                            });
                            htmlContent += '</div>';
                        } else {
                            htmlContent += '<hr class="section-divider">';
                        }
                    });
                    
                    teamContainer.innerHTML = htmlContent;
                })
                .catch(error => {
                    console.error('Error fetching team data:', error);
                    teamContainer.innerHTML = '<p style="color: var(--primary-color);">Could not load team information.</p>';
                });
        });
    </script>
</body>
</html>
