letely smudge over cars and houses. A 10m resolution means the pixel shrinks mathematically to 10-meter by 10-meter grids, cleanly capturing far more intricate details. Thus, the physically smaller the number, the incredibly sharper and <b>Better</b> the resolution!"}, {"type": "paragraph", "content": "<b>Question 3:</b> Which is freely available DEM:"}, {"type": "bullet", "content": "(a) SRTM-DEM"}, {"type": "bullet", "content": "(b) ASTER-GDEM"}, {"type": "bullet", "content": "(c) USGS-DEM"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) All of the above</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Huge governmental space agencies frequently generously release their digital global elevation datasets to the public strictly for free! You can currently eagerly download the Space Shuttle's SRTM data, the joint US/Japan ASTER-GDEM, and the American domestic USGS data completely legally without ever paying a dime. Because all of these massive global databases are technically public-domain science payloads, <b>All of the above</b> are entirely free!"}, {"type": "paragraph", "content": "<b>Question 4:</b> Which DEMs are having spatial resolution up to 30m:"}, {"type": "bullet", "content": "(a) USGS-DEM"}, {"type": "bullet", "content": "(b) USGS-DEM and SRTM-DEM"}, {"type": "bullet", "content": "(c) SRTM-DEM and ASTER-GDEM"}, {"type": "bullet", "content": "(d) USGS-DEM, SRTM-DEM and ASTER-GDEM"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) USGS-DEM, SRTM-DEM and ASTER-GDEM</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> When global elevation databases were initially publicly established, the American benchmark standardized around providing approximately 30-meter grids (or 1 Arc-Second). USGS domestic datasets famously hit 30m. ASTER-GDEM was deliberately released globally at 30m. Most recently, NASA generously upgraded the entire global SRTM grid from 90m down perfectly to 30m resolution too. Meaning practically <b>All three</b> prominent databases comfortably offer sharp 30-meter grids today!"}, {"type": "paragraph", "content": "<b>Question 5:</b> What is spatial interpolation?"}, {"type": "bullet", "content": "(a) The process of establishing values for areas outside the boundary of an existing set of data points"}, {"type": "bullet", "content": "(b) The process of establishing a statistical relationship between two spatially correlated variables"}, {"type": "bullet", "content": "(c) The process of modelling spatial pattern from a set of one or more data layers"}, {"type": "bullet", "content": "(d) The process of establishing values for areas between an existing set of discrete observations"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) The process of establishing values for areas between an existing set of discrete observations</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Spatial interpolation means mathematically connecting the dots. If you firmly set down thermometers (the discrete observations), what happens logically in the empty blank grass directly <i>between</i> them? Interpolation runs math heavily blending those firm outer anchors to confidently guess that empty inner hole. (Note: guessing what happens completely <i>outside</i> the entire boundary is called 'extrapolation', not interpolation!)"}, {"type": "paragraph", "content": "<b>Question 6:</b> Cartosat-1 & 2 provide?"}, {"type": "bullet", "content": "(a) Stereo pairs"}, {"type": "bullet", "content": "(b) SAR data"}, {"type": "bullet", "content": "(c) Thermal images"}, {"type": "bullet", "content": "(d) LiDAR data"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Stereo pairs</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> The Indian Space Research Organisation (ISRO) famously launched the Cartosat-1 and 2 satellites specifically dedicated entirely to massive earth mapping operations. To wonderfully extract 3D elevation height from a flat optical photo, you strictly need viewing the literal same mountain from two distinctly different angled camera lenses\u2014mimicking human 3D stereoscopic eyesight! Cartosat is expressly built bearing these tandem multi-angled forward/backward cameras generating rich <b>Stereo pairs</b>!"}, {"type": "paragraph", "content": "<b>Question 7:</b> The most common use of Theissen\u2019s Polygons is to create contour lines."}, {"type": "bullet", "content": "(a) True"}, {"type": "bullet", "content": "(b) False"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) False</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> This is categorically <b>False</b>. Contour lines are wonderfully smooth swirling continuous curves mapping gradients. Conversely, Thiessen Polygons violently smash the map into harsh, jagged, sharp flat geometric shards representing 'territory boundaries' or regions of influence (like drawing hospital catchment zones). Because they are mathematically fully flat internally, you absolutely cannot draw smooth sloping contour lines through them."}, {"type": "paragraph", "content": "<b>Question 8:</b> The direction of a slope with reference to north:"}, {"type": "bullet", "content": "(a) Slope"}, {"type": "bullet", "content": "(b) Gradient"}, {"type": "bullet", "content": "(c) Aspect"}, {"type": "bullet", "content": "(d) Slope aspect"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Aspect</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> In terrain analysis, 'Slope' calculates how steeply a mountain physically rises. But exactly which way is that mountainside facing like a billboard? Does the house overlook facing the Southern sun or the dark North? The exact compass direction that the sloping surface physically points toward (measured mathematically in degrees from true North) is formally designated as the <b>Aspect</b>."}, {"type": "paragraph", "content": "<b>Question 9:</b> \u2026\u2026\u2026\u2026.. is a statistical concept which states the likelihood or probability that a particular set of measurements are within certain range of true value:"}, {"type": "bullet", "content": "(a) Error"}, {"type": "bullet", "content": "(b) Inaccuracy"}, {"type": "bullet", "content": "(c) Accuracy"}, {"type": "bullet", "content": "(d) Precision"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Accuracy</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Imagine a dartboard! 'Precision' simply means your darts all grouped tightly together\u2014even if they all completely missed the actual center bullseye. '<b>Accuracy</b>', however, mathematically describes fundamentally how incredibly close those darts actually struck relative directly to the true objective bullseye center! It mathematically evaluates probability and statistical closeness specifically to the verified 'true value'."}, {"type": "paragraph", "content": "<b>Question 10:</b> \u2018No data\u2019 is a:"}, {"type": "bullet", "content": "(a) Value"}, {"type": "bullet", "content": "(b) Always equal to 1"}, {"type": "bullet", "content": "(c) Zero"}, {"type": "bullet", "content": "(d) Nothing"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Value</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> This sounds tricky! While 'NoData' physically represents the frustrating absence of legitimate geographic measurements (like missing a reading), inside the computer's memory grid, you literally cannot legally have a blank grid hole. The computer must aggressively assign a rigid digital numerical '<b>Value</b>' (often deeply negative like -9999) exclusively acting as a giant stop-sign telling the software to ignore reading it."}]}, "assignment_09.json": {"id": "assignment_09", "title": "Week 9: Assignment 9", "blocks": [{"type": "heading", "content": "\ud83d\udcd8 Week 9: Assignment 9"}, {"type": "paragraph", "content": "<b>Question 1:</b> A DEM is a raster representation of a \u2026\u2026\u2026 surface?"}, {"type": "bullet", "content": "(a) Discrete"}, {"type": "bullet", "content": "(b) Continuous"}, {"type": "bullet", "content": "(c) Triangulated"}, {"type": "bullet", "content": "(d) Quadtree"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Continuous</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> A DEM (Digital Elevation Model) is explicitly built mapping rolling terrain hills and valleys. Since terrain technically spreads forever across the landscape endlessly without suddenly abruptly pausing into empty blank voids, ground elevations structurally physically behave perfectly as a fluid, unbroken, <b>Continuous</b> mathematical surface!"}, {"type": "paragraph", "content": "<b>Question 2:</b> The DEM could be generated through techniques such as photogrammetry, Lidar, InSAR, land surveying, etc.?"}, {"type": "bullet", "content": "(a) True"}, {"type": "bullet", "content": "(b) False"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) True</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Absolutely <b>True</b>! There is absolutely no single magical way tracking map elevations. Scientists practically use everything: calculating geometry off aerial stereo photos (Photogrammetry), rapidly shooting millions of laser bounces (LiDAR), fiercely utilizing satellite radar phase bouncing (InSAR/SAR), or old-fashioned terrestrial human tripod measurements literally hiking the mountains directly (Land Surveying)."}, {"type": "paragraph", "content": "<b>Question 3:</b> Grid (DEM) cell values can be:"}, {"type": "bullet", "content": "(a) Only integer numbers"}, {"type": "bullet", "content": "(b) Only real (floating) numbers"}, {"type": "bullet", "content": "(c) Only positive integer numbers"}, {"type": "bullet", "content": "(d) Both positive and negative integer or real (floating) numbers"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) Both positive and negative integer or real (floating) numbers</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Elevation heavily dictates this! A mountain might be 500 meters high (positive), while a deep valley like the Dead Sea famously plunges significantly below sea-level (negative). Furthermore, heights aren't always perfect steps; a slope could realistically measure roughly 120.45 meters (a real floating decimal). Thus, the pixel values comprehensively must support exactly <b>Both positive/negative and integer/real</b>!"}, {"type": "paragraph", "content": "<b>Question 4:</b> DEMs are commonly built using data collected using remote sensing techniques, but they may also be built from land surveying:"}, {"type": "bullet", "content": "(a) False"}, {"type": "bullet", "content": "(b) True"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) True</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Decidedly <b>True</b>! Today practically all massive 3D models strongly derive massively from automated satellite systems floating casually in space (remote sensing) merely for immense speed and scale. But historically long before rockets, geographers actively built excellent early topological models relying fully comprehensively on meticulous physical ground-level land surveying operations."}, {"type": "paragraph", "content": "<b>Question 5:</b> There is no universal usage of the terms digital elevation model (DEM), digital terrain model (DTM) and digital surface model (DSM) in scientific literature:"}, {"type": "bullet", "content": "(a) True"}, {"type": "bullet", "content": "(b) False"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) True</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> It's incredibly frustrating, but <b>True</b>! In America, practically everyone broadly calls heavily bare-earth rasters 'DTMs', while eagerly throwing the generic term 'DEM' wildly around loosely for almost anything holding elevation. But leap across the ocean logically into Europe, and many organizations aggressively reverse the specific terminology definitions entirely! There actively remains frustratingly zero completely unified legal global nomenclature."}, {"type": "paragraph", "content": "<b>Question 6:</b> Most of the terrain data providers (e.g. USGS, ERSDAC, CGIAR, ISRO-NRSA) use the term?"}, {"type": "bullet", "content": "(a) DSM"}, {"type": "bullet", "content": "(b) DTM"}, {"type": "bullet", "content": "(c) DEM"}, {"type": "bullet", "content": "(d) DES"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) DEM</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Despite the heavy academic arguments differentiating surface models from bare-earth grids, when massive government organizations wildly publish enormous global elevation grids out formally directly toward the general public downloading pools, practically every single one aggressively relies heavily solely upon the incredibly broadly understood catch-all marketing term: <b>DEM</b> (Digital Elevation Model)."}, {"type": "paragraph", "content": "<b>Question 7:</b> DEMs can be generated through number of ways, however most preferred method of generating DEMs is:"}, {"type": "bullet", "content": "(a) Contours"}, {"type": "bullet", "content": "(b) Remote sensing based"}, {"type": "bullet", "content": "(c) Aerial photographs"}, {"type": "bullet", "content": "(d) None of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Remote sensing based</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> How hard is walking literally thousands of miles manually dragging survey sticks over Mount Everest versus safely pushing a button engaging a massive satellite radar floating blissfully above the clouds? Because it seamlessly maps gigantic sprawling continents instantaneously reliably at drastically fractional costs without endangering human surveyors, <b>Remote Sensing</b> is unequivocally rapidly the world's most absolutely preferred modern generation method!"}, {"type": "paragraph", "content": "<b>Question 8:</b> DEMs can also be generated using the following method:"}, {"type": "bullet", "content": "(a) Stereo-pairs"}, {"type": "bullet", "content": "(b) Thermal infrared data"}, {"type": "bullet", "content": "(c) Radar data pairs"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) All of the above</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Generating 3D height safely from orbit legitimately requires mathematical wizardry viewing elements creatively. Stereo-pairs mathematically evaluate harsh camera parallax angles. Radar directly times exactly how long echoing microwave bursts powerfully blast downward striking mountainsides. And though wildly unconventional and horribly imprecise, heavily evaluating drastic terrestrial temperature changes (Thermal) across towering high mountain peaks <i>technically</i> yields crude estimated elevation models too!"}, {"type": "paragraph", "content": "<b>Question 9:</b> Spatial Interpolation techniques:"}, {"type": "bullet", "content": "(a) Turns raw data into useful information by adding greater informative content and value"}, {"type": "bullet", "content": "(b) Reveals patterns, trends, and anomalies that might otherwise be missed"}, {"type": "bullet", "content": "(c) Provides a check on human intuition"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) All of the above</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Interpolation algorithms cleverly predict blank spots. Looking merely directly at three isolated numbered dots on a blank map completely fails visually communicating the massive storm brewing there. Firing interpolation math vividly connecting those dots creates smooth colorful gradients actively turning those dots into meaningful intelligence, fiercely revealing hidden structural massive weather fronts mathematically crushing flawed human guessing!"}, {"type": "paragraph", "content": "<b>Question 10:</b> Functional surfaces can be used to represent:"}, {"type": "bullet", "content": "(a) Terrestrial surfaces that depict the earth\u2019s surface"}, {"type": "bullet", "content": "(b) Statistical surfaces that describe demographic"}, {"type": "bullet", "content": "(c) Mathematical surfaces that are based on arithmetic expressions"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) All of the above</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> A 'surface' in GIS mathematically only means numbers cleanly seamlessly flowing up and down continuously across a map grid. The Z-value height driving that surface can easily literally represent physical <b>Terrestrial</b> mountain meters! But wait\u2014that exact identical fluid visual 3D rolling mathematical surface could just as brilliantly conceptually map rising/falling city 'Crime Rates' or perfectly calculated <b>Mathematical</b> probability distributions!"}]}, "assignment_10.json": {"id": "assignment_10", "title": "Week 10: Assignment 10", "blocks": [{"type": "heading", "content": "\ud83d\udcd8 Week 10: Assignment 10"}, {"type": "paragraph", "content": "<b>Question 1:</b> Which of the following cannot be modelled using a DEM?"}, {"type": "bullet", "content": "(a) Slope"}, {"type": "bullet", "content": "(b) Aspect"}, {"type": "bullet", "content": "(c) Geology"}, {"type": "bullet", "content": "(d) Runoff"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Geology</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> A DEM (Digital Elevation Model) maps exactly what is on the surface, including the visible terrain. It can easily tell you how steep a hill is (Slope) or what direction it faces (Aspect). You can even use it to figure out where water will flow (Runoff). But it cannot see underground! The rocks, minerals, and layers under the earth (<b>Geology</b>) are hidden and cannot be modelled by surface elevation alone."}, {"type": "paragraph", "content": "<b>Question 2:</b> The rate of change of elevation is called:"}, {"type": "bullet", "content": "(a) Gradient"}, {"type": "bullet", "content": "(b) Slope"}, {"type": "bullet", "content": "(c) Aspect"}, {"type": "bullet", "content": "(d) Gradient slope"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Slope</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Imagine walking up a hill. How fast does the ground rise as you move forward? This mathematical 'rate of change' representing steepness is specifically called the <b>Slope</b>."}, {"type": "paragraph", "content": "<b>Question 3:</b> What is the difference between slope and aspect?"}, {"type": "bullet", "content": "(a) Slope is the distance down the fall line from the top of the slope to its bottom, while aspect is the percentage gradient of this line averaged over its full distance."}, {"type": "bullet", "content": "(b) Slope is the gradient directly down the fall line, while aspect is the direction of the fall line relative to north."}, {"type": "bullet", "content": "(c) Slope is the direction of the fall line, while aspect is the gradient of the fall line."}, {"type": "bullet", "content": "(d) Slope is the gradient of the fall line relative to vertical, while aspect is the direction of the fall line relative to the line of greatest slope."}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Slope is the gradient directly down the fall line, while aspect is the direction of the fall line relative to north.</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Very succinctly, if you spill water on a hill, it flows directly down the steepest path (the fall line). The steepness of that fall is the <b>Slope</b>. The compass direction that water travels (e.g., facing South or East) is called the <b>Aspect</b>."}, {"type": "paragraph", "content": "<b>Question 4:</b> Slope can be calculated from the formula S = b2 - c2."}, {"type": "bullet", "content": "(a) True"}, {"type": "bullet", "content": "(b) False"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) False</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> That's definitely <b>False</b>! That's just a random formula resembling Pythagorean math. In GIS, slope is mathematically calculated by evaluating differences between neighboring cells using advanced trigonometric tangent algorithms in a 3x3 grid, not a simple subtraction."}, {"type": "paragraph", "content": "<b>Question 5:</b> What is meant by the term 'precision'?"}, {"type": "bullet", "content": "(a) The extent to which a value approaches its true value"}, {"type": "bullet", "content": "(b) The lack of bias in the data"}, {"type": "bullet", "content": "(c) The level of detail at which data is stored"}, {"type": "bullet", "content": "(d) The overall quality of the data"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) The level of detail at which data is stored</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Precision is all about how tiny the details are recorded. If I say a tree is exactly '12.4567 meters high', that is an incredible amount of mathematical detail, making it highly <b>Precise</b>. It doesn't mean it's accurate (the tree might actually be 20 meters tall), but the format is highly detailed."}, {"type": "paragraph", "content": "<b>Question 6:</b> What is meant by the term 'data quality'?"}, {"type": "bullet", "content": "(a) The lineage of the data"}, {"type": "bullet", "content": "(b) The generalization present in the source data"}, {"type": "bullet", "content": "(c) The resolution of the data"}, {"type": "bullet", "content": "(d) The inherent quality of the data as characterized by its accuracy, precision, bias, level of error, etc."}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) The inherent quality of the data as characterized by its accuracy, precision, bias, level of error, etc.</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Data quality isn't just one thing. A truly high-quality map must be 'Accurate' (true to the real world), 'Precise' (detailed), and 'Unbiased' (not distorted). <b>Data Quality</b> is the grand summary of all these fitness checks together."}, {"type": "paragraph", "content": "<b>Question 7:</b> When an error in a dataset leads to the commission of another error this is called error:"}, {"type": "bullet", "content": "(a) Propagation"}, {"type": "bullet", "content": "(b) False precision"}, {"type": "bullet", "content": "(c) Horizontal error"}, {"type": "bullet", "content": "(d) Cascading"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Propagation</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> If your starting map has a 5-foot mistake, and you use that map to calculate water flow, the water flow result will also hold that mistake. Utilizing faulty mathematical inputs creates equally faulty outputs, mathematically weaving the error deeper into the final analysis. This domino-effect spread is called 'Error <b>Propagation</b>'."}, {"type": "paragraph", "content": "<b>Question 8:</b> DEMs can be prepared from:"}, {"type": "bullet", "content": "(a) Raster stereo pair"}, {"type": "bullet", "content": "(b) Contours"}, {"type": "bullet", "content": "(c) InSAR technique"}, {"type": "bullet", "content": "(d) All the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) All the above</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> A DEM is just a final product grid, and you can build it using whatever data you have! You can build it by analyzing flat topographical maps (Contours), bouncing radar beams (InSAR), or computing angles from twin satellite cameras (Stereo pairs). <b>All</b> are valid methods!"}, {"type": "paragraph", "content": "<b>Question 9:</b> The shape of unit of DEM can only be:"}, {"type": "bullet", "content": "(a) Rectangular"}, {"type": "bullet", "content": "(b) Circular"}, {"type": "bullet", "content": "(c) Square"}, {"type": "bullet", "content": "(d) Triangle"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Square</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> True DEMs are raster files, which behave mathematically like a digital graph paper grid. This grid strongly requires perfectly symmetrical X and Y geometries to avoid stretching calculations, resulting in the foundational cell unit permanently remaining flawlessly <b>Square</b>."}, {"type": "paragraph", "content": "<b>Question 10:</b> The cell value of a DEM can have:"}, {"type": "bullet", "content": "(a) Both positive and negative, integer and real values"}, {"type": "bullet", "content": "(b) Only positive integer values"}, {"type": "bullet", "content": "(c) Only negative integer and real values"}, {"type": "bullet", "content": "(d) Only positive real values"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Both positive and negative, integer and real values</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> The Earth has extreme depth and height. We need mathematically <b>positive</b> numbers for mountains and <b>negative</b> numbers for areas like Death Valley or the Dead Sea. Also, heights are not nicely rounded clean chunks\u2014we must use <b>real/decimal</b> details (e.g., 20.4 meters) to model precise reality instead of just flat integers."}]}, "assignment_11.json": {"id": "assignment_11", "title": "Week 11: Assignment 11", "blocks": [{"type": "heading", "content": "\ud83d\udcd8 Week 11: Assignment 11"}, {"type": "paragraph", "content": "<b>Question 1:</b> The shape of a cell of a DEM can only be:"}, {"type": "bullet", "content": "(a) Rectangular"}, {"type": "bullet", "content": "(b) Circular"}, {"type": "bullet", "content": "(c) Square"}, {"type": "bullet", "content": "(d) Triangle"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Square</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> A DEM uses a raster model which mathematically divides the Earth's surface into a uniform mesh. To prevent coordinate calculations from warping dramatically when analyzing diagonal distances, this foundational raster storage mesh permanently fixes its fundamental cell construction rigidly into perfectly uniform <b>Square</b> geometric units."}, {"type": "paragraph", "content": "<b>Question 2:</b> Overall shape of a DEM can only be:"}, {"type": "bullet", "content": "(a) Rectangular and square"}, {"type": "bullet", "content": "(b) Circular and triangular"}, {"type": "bullet", "content": "(c) Square and circular"}, {"type": "bullet", "content": "(d) Triangle and rectangular"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Rectangular and square</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> The internal grid cells must be perfectly square, but what about the overall outer boundary of the entire final DEM file? Because it's structured in standard computing arrays (rows and columns counting like a spreadsheet), the outer borders of the total file mathematically must cleanly end up forming an overarching shape perfectly aligned to 90 degrees\u2014meaning it can structurally solely form <b>Rectangular and square</b> borders."}, {"type": "paragraph", "content": "<b>Question 3:</b> An 8-bits DEM can have \u2026\u2026 total number of positive integer cell values:"}, {"type": "bullet", "content": "(a) 64"}, {"type": "bullet", "content": "(b) 128"}, {"type": "bullet", "content": "(c) 256"}, {"type": "bullet", "content": "(d) 65536"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) 256</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> This is classic computer binary math! A computer processes data in 1s and 0s (bits). If you allocate exactly 8 'bits' of memory to hold an integer, the mathematical calculation for its maximum capacity is 2 to the power of 8 (2^8). That equals exactly <b>256</b> distinct positive numerical values permitted (typically ranging uniformly from 0 to 255)."}, {"type": "paragraph", "content": "<b>Question 4:</b> A DEM that shows finer details is said to be of:"}, {"type": "bullet", "content": "(a) High resolution"}, {"type": "bullet", "content": "(b) Coarser resolution"}, {"type": "bullet", "content": "(c) Moderate resolution"}, {"type": "bullet", "content": "(d) Poor resolution"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) High resolution</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> In any digital image processing format (from TV screens to GIS maps), whenever a system shrinks its cells aggressively small enough to sharply reveal tiny intricate 'finer details' cleanly separating small objects, science fundamentally categorizes that deeply nuanced image as being <b>High resolution</b>!"}, {"type": "paragraph", "content": "<b>Question 5:</b> Which of the following is NOT a raster data structure?"}, {"type": "bullet", "content": "(a) Spaghetti"}, {"type": "bullet", "content": "(b) Run-length encoding"}, {"type": "bullet", "content": "(c) Quadtree"}, {"type": "bullet", "content": "(d) Block encoding"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Spaghetti</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Run-length, Quadtree, and Block encoding are all famous raster pixel-compression systems designed to cleanly pack square grid pixels efficiently. <b>Spaghetti</b>, however, is a famously chaotic historical term denoting a highly disorganized spaghetti-swirl of Vector lines drawn chaotically without mathematical topology. Thus, spaghetti strictly applies entirely into Vector mathematics, NOT Raster!"}, {"type": "paragraph", "content": "<b>Question 6:</b> Which of the following is advantage of DEMs over TINs?"}, {"type": "bullet", "content": "(a) DEMs do not require interpolation of point heights"}, {"type": "bullet", "content": "(b) DEMs do not require resampling if irregularly spaced input data is used"}, {"type": "bullet", "content": "(c) DEMs efficiently store data over varied terrain"}, {"type": "bullet", "content": "(d) DEMs use a simple data model"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) DEMs use a simple data model</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> A TIN is a complex web of massive, mathematically linked triangles. If you ask a computer to add two TIN terrains together, its brain physically cries trying to perfectly map tangled triangles! But a DEM Raster is undeniably just a dumb, flawlessly uniform rectangular grid sheet of numbers. Computers heavily love this perfectly rigid <b>simple data model</b> because evaluating simple gridded blocks scales smoothly computationally!"}, {"type": "paragraph", "content": "<b>Question 7:</b> The accuracy of a DEM created from DGNSS data will be low:"}, {"type": "bullet", "content": "(a) True"}, {"type": "bullet", "content": "(b) False"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) False</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> The statement is sharply <b>False</b>! DGNSS specifically stands for 'Differential Global Navigation Satellite System'. A standard GPS is okay, but 'Differential' GPS deploys secondary ground basestations to radically aggressively correct standard atmospheric GPS errors, routinely locking locations down flawlessly to insane centimeter-level pinpoint perfection. Therefore, DGNSS builds phenomenally accurate maps, not low-quality ones!"}, {"type": "paragraph", "content": "<b>Question 8:</b> A 'surface significant' point in a TIN model is one which can be closely interpolated from its neighbours."}, {"type": "bullet", "content": "(a) True"}, {"type": "bullet", "content": "(b) False"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) False</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Absolutely <b>False</b>. If a point strongly behaves exactly like everything politely surrounding it, it's boring and mathematically insignificant. A 'surface significant' point represents a violent sudden disruption\u2014like the peak pin of a sharp mountain or the deepest plunge of a jagged valley\u2014which fundamentally cannot possibly be broadly interpolated cleanly from mild surroundings!"}, {"type": "paragraph", "content": "<b>Question 9:</b> Spatial resolution of a DEM is?"}, {"type": "bullet", "content": "(a) Can be improved later"}, {"type": "bullet", "content": "(b) Vary with time"}, {"type": "bullet", "content": "(c) Fixed once the DEM is created"}, {"type": "bullet", "content": "(d) None of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Fixed once the DEM is created</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Imagine taking an incredibly blurry photo initially. You literally cannot click an 'enhance' button mathematically hallucinating true real-world structural details back into those fuzzy pixels that your camera absolutely never actually saw. In identical fashion, once an original DEM grid is finalized and firmly burned to memory, its deepest fundamental granular measuring 'vision limits' remain definitively structurally <b>Fixed</b>."}, {"type": "paragraph", "content": "<b>Question 10:</b> DSM is a surface which can be used to represent:"}, {"type": "bullet", "content": "(a) Groundwater levels"}, {"type": "bullet", "content": "(b) Chemical qualities of soils"}, {"type": "bullet", "content": "(c) Chemical qualities of water"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) All of the above</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> A 'Surface Model' doesn't solely strictly mean dirt height! Much like you use mathematical grids mapping rolling hills physically, you can elegantly use the exact fundamentally identical fluid mathematical 'Z-values' to paint continuous 'tops' displaying deep plunging <b>Groundwater level</b> dips, smoothly map surging <b>Chemical soil</b> pollution clouds, or elegantly track <b>Water qualities</b>. Thus, they powerfully accommodate <b>All of the above</b> fluid datasets!"}]}};
    const listElement = document.getElementById('assignment-list');
    const renderArea = document.getElementById('render-area');
    const contentContainer = document.getElementById('content-container');

    Object.keys(assignmentsDB).forEach((file, index) => {
        let btn = document.createElement('button');
        btn.className = 'nav-link';
        btn.innerHTML = `Week ${index + 1} Assignment`;
        btn.onclick = () => {
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            btn.classList.add('active');
            loadAssignment(file);
        };
        listElement.appendChild(btn);
    });

    function loadAssignment(filename) {
        const data = assignmentsDB[filename];
        if(!data) return;
        
        let html = '';
        data.blocks.forEach(block => {
            if (block.type === 'heading') {
                html += `<div class="block-heading">${block.content}</div>`;
            } else if (block.type === 'paragraph') {
                html += `<div class="block-paragraph">${block.content}</div>`;
            } else if (block.type === 'bullet') {
                html += `<div class="block-bullet">${block.content}</div>`;
            }
        });
        
        renderArea.style.animation = 'none';
        renderArea.offsetHeight; 
        renderArea.innerHTML = html;
        renderArea.style.animation = 'fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
        contentContainer.scrollTop = 0;
    }
</script>
