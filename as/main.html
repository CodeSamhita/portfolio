        .nav-pills .nav-link { color: #94a3b8; border-radius: 8px; margin-bottom: 10px; font-weight: 600; padding: 14px 20px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; border: none; text-align: left; width: 100%; display: block; background: transparent;}

<script>
    const assignmentsDB = {"assignment_01.json": {"id": "assignment_01", "title": "Week 1: Assignment 1", "blocks": [{"type": "heading", "content": "\ud83d\udcd8 Week 1: Assignment 1"}, {"type": "paragraph", "content": "<b>Question 1:</b> GIS is \u2026\u2026\u2026\u2026\u2026 and \u2026\u2026\u2026.\u2026 technology."}, {"type": "bullet", "content": "(a) Digital and analogue"}, {"type": "bullet", "content": "(b) Spatial and analogue"}, {"type": "bullet", "content": "(c) Digital and spatial"}, {"type": "bullet", "content": "(d) Spatial and manual"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Digital and spatial</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Think of GIS (Geographic Information System) as a smart digital map. It runs on computer systems, meaning it is entirely <b>digital</b>. Its core purpose is to deal with maps and geography\u2014where things are physically located on Earth\u2014which makes it <b>spatial</b>. Analogue means paper maps or non-digital things, and GIS is built to modernize and replace analogue mapping methods."}, {"type": "paragraph", "content": "<b>Question 2:</b> Three basic kinds of vector entities are:"}, {"type": "bullet", "content": "(a) Point, Raster, Attributes"}, {"type": "bullet", "content": "(b) Image, Raster, Polygon"}, {"type": "bullet", "content": "(c) Point, Line, Polygon"}, {"type": "bullet", "content": "(d) Polyline, Polygon, Raster"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Point, Line, Polygon</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Imagine you are drawing a map with a pencil. You can draw a dot to represent a single tree (<b>Point</b>). You can draw a connected path to show a river or road (<b>Line</b>). Finally, you can draw an enclosed shape, like a square or circle, to show a lake or building footprint (<b>Polygon</b>). Raster is a completely different data type based on a grid of pixels (like photographs), not vector graphics."}, {"type": "paragraph", "content": "<b>Question 3:</b> GIS, Remote Sensing and GPS technologies are:"}, {"type": "bullet", "content": "(a) Generic, digital and spatial"}, {"type": "bullet", "content": "(b) Manual, spatial and digital"}, {"type": "bullet", "content": "(c) Analogue, manual and spatial"}, {"type": "bullet", "content": "(d) Generic, analogue and spatial"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Generic, digital and spatial</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> All three of these modern technologies are related to analyzing our planet! They are <b>digital</b> (using software and satellites rather than pen and paper), and they are <b>spatial</b> (focusing on physical Earth coordinates). They are also <b>generic</b> because they are flexible tools that can be applied to thousands of different disciplines, from forestry to urban planning or delivery logistics."}, {"type": "paragraph", "content": "<b>Question 4:</b> Topology describes the \u2026\u2026 relationships between adjacent features:"}, {"type": "bullet", "content": "(a) Spectral"}, {"type": "bullet", "content": "(b) Special"}, {"type": "bullet", "content": "(c) Spatial"}, {"type": "bullet", "content": "(d) Especial"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Spatial</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Think of a puzzle. Topology is how the computer understands the puzzle pieces fitting together. It describes the <b>spatial relationships</b> between shapes\u2014for instance, acknowledging that Country A directly shares a border with Country B without any overlaps or gaps. 'Spectral' refers to light (used in cameras/satellites), while 'spatial' directly means concerning space and geometry."}, {"type": "paragraph", "content": "<b>Question 5:</b> Which of the following is not an example of spatial data?"}, {"type": "bullet", "content": "(a) Points showing location of discrete objects"}, {"type": "bullet", "content": "(b) Times of particular events"}, {"type": "bullet", "content": "(c) Lines showing the route of linear objects"}, {"type": "bullet", "content": "(d) Polygons showing the area occupied by a particular land use or variable"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Times of particular events</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Spatial data must deal with <i>where</i> things are (Points, Lines, Polygons representing locations). 'Times of particular events' answers <i>when</i> something happened, which is called <b>temporal data</b>. While time easily attaches precisely to an object (like when a tree fell down), the time itself without a location cannot be plotted on a map."}, {"type": "paragraph", "content": "<b>Question 6:</b> Geographic Information System (GIS) is a \u2026\u2026\u2026\u2026\u2026. based information system designed to accept large volumes of \u2026\u2026\u2026\u2026 data derived from variety of sources and to efficiently store, retrieve, \u2026\u2026\u2026\u2026.. model and display (output) these data according to \u2026\u2026\u2026 defined specifications."}, {"type": "bullet", "content": "(a) Manual, Special, Recover, All"}, {"type": "bullet", "content": "(b) Manual, Temporal, Analyses, User"}, {"type": "bullet", "content": "(c) Computer, Spatial, Analyses, User"}, {"type": "bullet", "content": "(d) Computer, Timely, Delete, Not"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Computer, Spatial, Analyses, User</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Let's fill in the blanks like a puzzle! GIS runs on a <b>Computer</b>, not manually. It processes large volumes of <b>Spatial</b> (location-based) data. Its primary strength is to <b>analyze</b> (or <b>Analyses</b>) this data to help humans make decisions. Finally, who decides what exactly needed to be shown? The <b>User</b> specifies what they want entirely!"}, {"type": "paragraph", "content": "<b>Question 7:</b> Attribute data are one type of spatial data."}, {"type": "bullet", "content": "(a) True"}, {"type": "bullet", "content": "(b) False"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) False</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> It is false because Spatial Data and Attribute Data are two distinct halves of GIS. <b>Spatial data</b> represents the actual geometry (the shape and location of a house). <b>Attribute data</b> (also called non-spatial data) is the information packed inside an excel sheet describing that shape (like the owner's name, the color of the house, or the exact price). They are linked together, but attribute data itself has no shape or coordinates."}, {"type": "paragraph", "content": "<b>Question 8:</b> Polygon topological data model is part of:"}, {"type": "bullet", "content": "(a) Path topological models"}, {"type": "bullet", "content": "(b) Graph Topological models"}, {"type": "bullet", "content": "(c) Triangulated Irregular Network"}, {"type": "bullet", "content": "(d) Dual Independent Map model"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Graph Topological models</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> In GIS mathematics and computing, topography describing polygons falls under the mathematical branch of <b>Graph Theory</b>. Graph theory describes how sets of nodes (points/vertices) connect via edges (lines) to form enclosed areas (polygons). Therefore, building topology maps in GIS heavily borrows logic directly from Graph Topological Models."}, {"type": "paragraph", "content": "<b>Question 9:</b> Name five components of GIS:"}, {"type": "bullet", "content": "(a) Software, Data, Methods, Theory, Printers"}, {"type": "bullet", "content": "(b) Hardware, Software, Data, Methods, People"}, {"type": "bullet", "content": "(c) Hardware, Software, Maps, Data, Theory"}, {"type": "bullet", "content": "(d) Software, Equations, Maps, Theory, People"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Hardware, Software, Data, Methods, People</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> To successfully operate GIS in any organization, you need five distinct pillars: First, you need the physical computers and servers (<b>Hardware</b>) to run the programs (<b>Software</b>). You absolutely must have geographic information to process (<b>Data</b>). You must have official standard procedures and protocols (<b>Methods</b>) to ensure accuracy. But most importantly, you need the trained experts (<b>People</b>) who orchestrate it all!"}, {"type": "paragraph", "content": "<b>Question 10:</b> 3D lines / polylines features embed their \u2026\u2026.. inside their geometry."}, {"type": "bullet", "content": "(a) x-value"}, {"type": "bullet", "content": "(b) y-value"}, {"type": "bullet", "content": "(c) z-value"}, {"type": "bullet", "content": "(d) t-value"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) z-value</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> In the mapping world, looking at a flat 2D map involves tracing coordinates horizontally (<b>X-value</b>) or vertically (<b>Y-value</b>). However, when we talk about \u20183D lines\u2019, we add depth and elevation! Height or depth in mathematics is always assigned to the Z-axis. So a 3D line inherently stores a <b>Z-value</b> inside its actual drawn geometry to sit nicely above ground or below sea level!"}]}, "assignment_02.json": {"id": "assignment_02", "title": "Week 2: Assignment 2", "blocks": [{"type": "heading", "content": "\ud83d\udcd8 Week 2: Assignment 2"}, {"type": "paragraph", "content": "<b>Question 1:</b> How many basic kinds of attributes so far know in GIS domain?"}, {"type": "bullet", "content": "(a) 4"}, {"type": "bullet", "content": "(b) 5"}, {"type": "bullet", "content": "(c) 6"}, {"type": "bullet", "content": "(d) 7"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) 6</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> When classifying the types of tabular data you can store in GIS, we normally recognize <b>6</b> fundamental types. These are Nominal (categories/names), Ordinal (ranking or order), Interval (ranges without true zero), Ratio (absolute numbers starting at zero), Cyclic (repeating cycles like seasons or wind), and Counts/Amounts (total tallies of items). Understanding these dictates how maps can visually display your data!"}, {"type": "paragraph", "content": "<b>Question 2:</b> A nominal attribute can be:"}, {"type": "bullet", "content": "(a) Only numeric"}, {"type": "bullet", "content": "(b) Only alpha-numeric"}, {"type": "bullet", "content": "(c) Only alphabets"}, {"type": "bullet", "content": "(d) Numeric, alpha-numeric and alphabets"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) Numeric, alpha-numeric and alphabets</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> The word 'Nominal' means 'in name only'. It is specifically used for naming or labeling categories where the value represents a label, not an actual mathematical amount. For example, a zip code is numeric (e.g., 90210), a license plate is alpha-numeric (e.g., A1B23), and a soil type is alphabetic (e.g., 'Clay'). Hence, nominal data can take <b>all three</b> flexible formats as long as its purpose is just naming categories!"}, {"type": "paragraph", "content": "<b>Question 3:</b> Ratio attributes have the same characteristics as interval variables, but in addition, these have:"}, {"type": "bullet", "content": "(a) No order"}, {"type": "bullet", "content": "(b) No starting point"}, {"type": "bullet", "content": "(c) No order neither starting point"}, {"type": "bullet", "content": "(d) Zero or starting point"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) Zero or starting point</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> The only difference between 'Interval' and 'Ratio' data is an absolute zero! Interval data like temperature (Celsius/Fahrenheit) can go comfortably into negative because its 0\u00b0 isn't true absolute zero (there's no absence of heat at 0\u00b0C). However, ratio data like measuring rainfall, distance, or a tree's height cannot physically be below zero. Thus, Ratio data strictly retains a true, absolute <b>Zero or starting point</b>."}, {"type": "paragraph", "content": "<b>Question 4:</b> In TIN model, triangles are made from a set of points called:"}, {"type": "bullet", "content": "(a) 2D points"}, {"type": "bullet", "content": "(b) 3D points"}, {"type": "bullet", "content": "(c) Random points"}, {"type": "bullet", "content": "(d) Mass points"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) Mass points</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> TIN stands for 'Triangulated Irregular Network', which is an excellent way to digitally represent 3D terrains like mountains. A TIN naturally connects points containing elevation information to weave a smooth web of interconnected triangles. In GIS terminology, the heavy collection of elevation points originally surveyed and specifically inputted to generate these triangles are professionally called <b>Mass points</b>."}, {"type": "paragraph", "content": "<b>Question 5:</b> TIN model stores data in:"}, {"type": "bullet", "content": "(a) Node table"}, {"type": "bullet", "content": "(b) Edge table"}, {"type": "bullet", "content": "(c) X, Y coordinate and Z tables"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) All of the above</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> A TIN model creates complex topographical networks. To perfectly recreate this 3D web on screen, the computer doesn't just store random shapes. It needs an inventory! It stores a table remembering where the points are (Node Table), a table noting which point lines physically attach to which (Edge Table), and importantly, the actual location properties (X, Y horizontal coordinates and the Z vertical elevations). It therefore needs <b>All of the above</b> to correctly visualize!"}, {"type": "paragraph", "content": "<b>Question 6:</b> TIN model is adaptable to surface roughness:"}, {"type": "bullet", "content": "(a) True"}, {"type": "bullet", "content": "(b) False"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) True</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Absolutely true! The biggest advantage of TIN over raster grids is its brilliant flexibility. Where a landscape is incredibly flat and smooth, TIN generates huge triangles, saving memory. But when it runs across a highly complex rocky, steep, or rough terrain, it adapts rapidly and throws down thousands of tiny triangles to capture all the intricate detail. It is highly <b>adaptable to surface roughness</b>!"}, {"type": "paragraph", "content": "<b>Question 7:</b> It is not possible to make subset of:"}, {"type": "bullet", "content": "(a) Points"}, {"type": "bullet", "content": "(b) Raster"}, {"type": "bullet", "content": "(c) TIN"}, {"type": "bullet", "content": "(d) Polylines"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) TIN</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> In standard operations, you can smoothly crop out an area of Points or Polylines, and clip raster images flawlessly. But a TIN surface is generated organically based on a unique triangulation formula interconnecting all mass points. Trying to mechanically cut a rigid mathematical square out of it breaks the connected integrity of those interconnected triangles, meaning making smaller functional cropped subsets of <b>TIN</b> structures is fundamentally unviable."}, {"type": "paragraph", "content": "<b>Question 8:</b> The measure of how closely pixels /cells can be resolved in an image / grid is called:"}, {"type": "bullet", "content": "(a) Spectral resolution"}, {"type": "bullet", "content": "(b) Radiometric resolution"}, {"type": "bullet", "content": "(c) Temporal resolution"}, {"type": "bullet", "content": "(d) Spatial resolution"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) Spatial resolution</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> When you zoom into an image, you finally see small squares called 'pixels'. If a satellite image specifies that one pixel equals exactly 1 square meter on the physical ground, then you've just learned its <b>Spatial Resolution</b>! It tells us about the size of the smallest visible geometric unit. Conversely, Temporal means time gaps between satellite orbits, and Spectral applies to picking up different light bands."}, {"type": "paragraph", "content": "<b>Question 9:</b> The \u2026\u2026. model is extremely useful for describing discrete features, but less useful for describing continuously varying features."}, {"type": "bullet", "content": "(a) Vector"}, {"type": "bullet", "content": "(b) Raster"}, {"type": "bullet", "content": "(c) TIN"}, {"type": "bullet", "content": "(d) 3D"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Vector</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> We have two main players in GIS mapping mapping: Vector and Raster. The <b>Vector model</b> relies on distinct boundaries. If it's a building, you can cleanly draw a vector shape indicating exactly where it starts and completely ends (a discrete feature!). But attempting to use clear stiff lines to map something that constantly fluidly shifts and smears across the landscape infinitely without harsh boundaries, like air temperature or rainfall patterns, gets highly messy and inefficient."}, {"type": "paragraph", "content": "<b>Question 10:</b> In terms of positional accuracy\u2026\u2026\u2026 model is good."}, {"type": "bullet", "content": "(a) Vector"}, {"type": "bullet", "content": "(b) Raster"}, {"type": "bullet", "content": "(c) TIN"}, {"type": "bullet", "content": "(d) 3D"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Vector</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> A Raster grid paints maps using large chunky square pixels. Something like a tree location might just be an approximate guess roughly snapping inside a big 20m x 20m pixel square. But the <b>Vector model</b> stores its location coordinates via complex math as infinitely sharp exact numbers down to tiny decimal fractions! It provides beautifully precise sharp geometry, making it inherently superior for pinpoint positional accuracy."}]}, "assignment_03.json": {"id": "assignment_03", "title": "Week 3: Assignment 3", "blocks": [{"type": "heading", "content": "\ud83d\udcd8 Week 3: Assignment 3"}, {"type": "paragraph", "content": "<b>Question 1:</b> In georeferencing, if a user chooses third order polynomial equation, then minimum number of required GCPs required are:"}, {"type": "bullet", "content": "(a) 10"}, {"type": "bullet", "content": "(b) 12"}, {"type": "bullet", "content": "(c) 13"}, {"type": "bullet", "content": "(d) 14"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) 10</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Georeferencing is stretching a flat unmapped image to fit perfectly onto the Earth's curved digital surface. We 'anchor' it down using Ground Control Points (GCPs). Depending on how much twisting, curving, and stretching an image requires to fit smoothly over hills, we select higher 'polynomial orders'. For a 1st order transformation, we need minimum 3 GCPs; for a 2nd order, 6. If our terrain is rough enough to demand a highly complex <b>third order polynomial</b>, then mathematical conventions dictate we must place an absolute minimum of <b>10 GCPs</b> to reliably calculate the intense geometric warping."}, {"type": "paragraph", "content": "<b>Question 2:</b> In Georeferencing the y-scale (E) is \u2026\u2026\u2026.., because the origins of an image and a geographic coordinate system are different.:"}, {"type": "bullet", "content": "(a) Positive"}, {"type": "bullet", "content": "(b) Negative"}, {"type": "bullet", "content": "(c) Square root"}, {"type": "bullet", "content": "(d) None of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Negative</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> When reading a standard mathematical coordinate graph (Cartesian system), moving upwards conceptually moves into 'positive' Y territories. However, raw digital image software behaves differently\u2014the pixel origin (0,0 point) is always anchored at the top-left corner, and as you count down the image rows towards the bottom, those pixel numbers increase. So, map coordinates go UP, but image pixels go DOWN. This reversal implies that mathematically translating the geographic scale to fit the image requires the spatial Y-scale element to be fundamentally <b>Negative</b>."}, {"type": "paragraph", "content": "<b>Question 3:</b> Relatively Quadtrees raster data compression technique provides:"}, {"type": "bullet", "content": "(a) High compression"}, {"type": "bullet", "content": "(b) No compression"}, {"type": "bullet", "content": "(c) Less compression"}, {"type": "bullet", "content": "(d) Maximum compression"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) High compression</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Raster maps consume immense disk space because they stubbornly remember the color of every single pixel on the grid, even across massive blank stretches like uniform lakes. 'Quadtrees' is an incredibly clever recursive algorithm that divides large homogenous areas of identical pixels into a single block instead of thousands of tiny pieces, splitting only when pixel details change. Through this smart mathematical clumping, it manages to achieve highly respectable <b>High compression</b>."}, {"type": "paragraph", "content": "<b>Question 4:</b> MrSID raster data compression technique can provide compression upto:"}, {"type": "bullet", "content": "(a) 30:1"}, {"type": "bullet", "content": "(b) 40:1"}, {"type": "bullet", "content": "(c) 50:1"}, {"type": "bullet", "content": "(d) 60:1"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) 50:1</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Let me introduce you to MrSID (Multi-resolution Seamless Image Database). It isn't a person, but an incredibly efficient, heavily-patented wavelet compression format designed exclusively to crush the immense file sizes of massive satellite datasets. If your aerial photo size was initially 50 Gigabytes, the MrSID format possesses the tremendous capability to squeeze that gigantic file down to a mere 1 Gigabyte while retaining recognizable geometric quality, attaining unbelievable compression ratios of up to <b>50:1</b>."}, {"type": "paragraph", "content": "<b>Question 5:</b> During data generalization, number of nodes of a polyline / polygon are:"}, {"type": "bullet", "content": "(a) Increased"}, {"type": "bullet", "content": "(b) No change"}, {"type": "bullet", "content": "(c) Reduced"}, {"type": "bullet", "content": "(d) None of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Reduced</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Consider drawing the wildly uneven jagged coastline of Britain. If we want to zoom far out to show a broad map of the entire Earth, computing all million microscopic jagged bends of that coastline is an absolute waste of memory and visually clutters the screen. 'Generalization' is precisely the technique of mathematically simplifying these shapes by systematically deleting excess corner points while retaining the general vibe. Consequently, by purposefully deleting points, the number of nodes is fundamentally <b>Reduced</b>."}, {"type": "paragraph", "content": "<b>Question 6:</b> What does the abbreviation RDBMS stand for?"}, {"type": "bullet", "content": "(a) Digital Base Mapping System"}, {"type": "bullet", "content": "(b) Database Manipulation Software"}, {"type": "bullet", "content": "(c) Data Borrowing and Movement Software"}, {"type": "bullet", "content": "(d) Relational Database Management System"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) Relational Database Management System</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Almost all modern heavy-duty GIS applications store their tabular attribute data off-site in highly secure, well-structured vaults rather than inside the maps themselves. These vaults organize information into individual clear tables that cross-reference ('relate') to one another smoothly upon request. This critical underlying software mechanism running the logic of referencing is universally termed the <b>Relational Database Management System</b>."}, {"type": "paragraph", "content": "<b>Question 7:</b> In which database tables are related by sharing common entity characteristic(s):"}, {"type": "bullet", "content": "(a) Hierarchical"}, {"type": "bullet", "content": "(b) Network"}, {"type": "bullet", "content": "(c) Relational"}, {"type": "bullet", "content": "(d) Object-Oriented"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Relational</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Imagine holding a sheet containing employee names and their assigned Department ID numbers. Now picture holding a totally separate second sheet listing Department ID numbers alongside building room assignments. In a <b>Relational Database</b>, the system intrinsically understands how to link those two physically separate sheets together smoothly because they share one perfectly matching defining column acting as a bridge\u2014the 'Department ID' column! Building bridges via shared characteristics is the hallmark of Relational architecture."}, {"type": "paragraph", "content": "<b>Question 8:</b> The advantage of Standard Query Language (SQL) in relation to GIS databases?"}, {"type": "bullet", "content": "(a) It is special"}, {"type": "bullet", "content": "(b) It is simple and easy to understand"}, {"type": "bullet", "content": "(c) It uses a true-English style of questioning"}, {"type": "bullet", "content": "(d) It is good at handling geographical concepts"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) It is simple and easy to understand</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> SQL is the undisputed programming language globally used for talking to tables. It wasn't actually built specifically for complex geographic mapping (it's relatively agnostic to geometry). So why has GIS wholeheartedly adopted it to manage attributes? Its greatest strength lies in its remarkable structural simplicity. A command like \"SELECT * FROM Parcels WHERE Price > 100000\" doesn't require convoluted coding; SQL is purposefully logically <b>simple and easy to understand</b>."}, {"type": "paragraph", "content": "<b>Question 9:</b> The measurement technique which uses 2D Cartesian mathematics to calculate lengths and areas is called:"}, {"type": "bullet", "content": "(a) Geographical measurement"}, {"type": "bullet", "content": "(b) Geodesic measurement"}, {"type": "bullet", "content": "(c) Geotagging measurement"}, {"type": "bullet", "content": "(d) Planar"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) Planar</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> If you unroll a massive paper map flat upon a table and drop a simple geometric ruler down locally to measure a direct line distance, you're engaging in Euclidean geometry upon a perfectly flattened dimension! Measurements taken assuming moving horizontally or vertically across a strictly smooth uncurved 2D mathematical surface grid are universally termed <b>Planar</b>."}, {"type": "paragraph", "content": "<b>Question 10:</b> Generally, all area measurements calculated are:"}, {"type": "bullet", "content": "(a) Planar"}, {"type": "bullet", "content": "(b) Geodesic"}, {"type": "bullet", "content": "(c) Geodetic"}, {"type": "bullet", "content": "(d) Geographic"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Planar</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> By default, standard GIS drawing platforms mathematically operate inside mapped projections. When projecting the 3D globe onto a computer monitor, we intentionally 'flatten' portions of the earth to render them visually cleanly! Because we are calculating the acreage of fields or building floors strictly operating within these previously flattened mathematical projected coordinate systems, almost all general area calculations outputted routinely operate as purely <b>Planar</b>."}]}, "assignment_04.json": {"id": "assignment_04", "title": "Week 4: Assignment 4", "blocks": [{"type": "heading", "content": "\ud83d\udcd8 Week 4: Assignment 4"}, {"type": "paragraph", "content": "<b>Question 1:</b> Basic GIS functions are:"}, {"type": "bullet", "content": "(a) Area and distance measurement"}, {"type": "bullet", "content": "(b) Buffer generation"}, {"type": "bullet", "content": "(c) Reclassification"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) All of the above</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> The fundamental reason GIS outclasses a simple static map lies in its dynamic analytical toolset! Users universally rely on GIS to instantly output physical dimensional math (<b>Area and distance measurement</b>), establish perimeter zones around features for planning (<b>Buffer generation</b>), and visually recolor grids reflecting simplified categorized themes (<b>Reclassification</b>). These powerful mechanisms perfectly characterize <b>All of the above</b> as basic structural pillars."}, {"type": "paragraph", "content": "<b>Question 2:</b> Basic spatial analysis involves:"}, {"type": "bullet", "content": "(a) Attribute query"}, {"type": "bullet", "content": "(b) Spatial query"}, {"type": "bullet", "content": "(c) Both attribute and spatial queries"}, {"type": "bullet", "content": "(d) Auto query"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Both attribute and spatial queries</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> If you're analyzing urban parcels, you'll first likely ask textual questions like 'Show me all houses costing over $200k'\u2014this heavily relies strictly on tabular datasets (<b>Attribute Query</b>). However, you'll shortly transition into geometric questions like '...and now select which ones fall completely inside this boundary!'\u2014which intrinsically leverages locations (<b>Spatial Query</b>). Efficient integrated analysis fundamentally fuses <b>Both</b> dimensions together!"}, {"type": "paragraph", "content": "<b>Question 3:</b> What is a model?"}, {"type": "bullet", "content": "(a) A model is a suite of computer programs."}, {"type": "bullet", "content": "(b) A model is a set of instructions to a GIS."}, {"type": "bullet", "content": "(c) A model is a method for storing spatial data."}, {"type": "bullet", "content": "(d) A model is a simplification of reality."}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) A model is a simplification of reality.</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Attempting to completely map every single microscopic blade of grass, pebble, or ant in a valley using computer algorithms is absolutely impossible. In computational sciences, whenever we build networks tracking rainfall, elevation, or pollution spread, we are mathematically intentionally reducing an enormously chaotic universe into clean, highly predictable logical parameters perfectly mimicking nature. Ultimately, a model remains at its core <b>a simplification of reality</b>."}, {"type": "paragraph", "content": "<b>Question 4:</b> \u201cPoints close together in space are more likely to have similar values than points farther apart\u201d is known as?"}, {"type": "bullet", "content": "(a) Tottenham Law of Geography"}, {"type": "bullet", "content": "(b) Totler's Law of Geography"}, {"type": "bullet", "content": "(c) Tobler's Law of Geography"}, {"type": "bullet", "content": "(d) Tobin Law of Geography"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Tobler's Law of Geography</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> The foundational logic behind all spatial modeling stems from one incredibly famous quote stated by Waldo Tobler: 'Everything is related to everything else, but near things are more related than distant things'. If it is heavily raining right above you, it is practically guaranteed to be raining 5 meters beside you\u2014but highly doubtful raining 500 miles away. In the GIS framework, this fundamental doctrine guaranteeing spatial continuity is internationally revered as the First Law of Geography, precisely named <b>Tobler's Law</b>."}, {"type": "paragraph", "content": "<b>Question 5:</b> Which of the following spatial interpolation techniques is an example of a local, exact, abrupt and deterministic interpolator?"}, {"type": "bullet", "content": "(a) TIN"}, {"type": "bullet", "content": "(b) Spline"}, {"type": "bullet", "content": "(c) Thiessen polygons"}, {"type": "bullet", "content": "(d) Spatial moving average"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Thiessen polygons</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Let's assume we randomly scattered rainfall stations. How do we cleanly define 'whose territory' belongs to which station? We mathematically draw geometric boundaries exactly halfway between adjacent stations. Now, every single inch of land inside a polygon rigidly assumes the EXACT values of its respective station without smoothly blending borders. Because this deterministic technique brutally slices the map into sharp mathematical shards mapping exact influence zones locally, we identify them as <b>Thiessen Polygons</b>."}, {"type": "paragraph", "content": "<b>Question 6:</b> Spatial interpolation is the procedure of estimating the value of properties at:"}, {"type": "bullet", "content": "(a) Observational location"}, {"type": "bullet", "content": "(b) Un-sample sites"}, {"type": "bullet", "content": "(c) Sample sites"}, {"type": "bullet", "content": "(d) None of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Un-sample sites</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> We definitively record precise temperatures at specific designated weather stations (Sample Sites). But what is the exact temperature lying in the vast empty geographic miles sitting squarely halfway between those outposts? We can't know definitively! We heavily utilize Tobler's Law mathematically predicting the blank empty spaces by weaving gradients from known anchors. Hence, interpolation generates calculated guesses strictly aimed at blank filling <b>Un-sample sites</b>."}, {"type": "paragraph", "content": "<b>Question 7:</b> Preprocessing in GIS involves the following:"}, {"type": "bullet", "content": "(a) Format conversion"}, {"type": "bullet", "content": "(b) Generalization"}, {"type": "bullet", "content": "(c) Merging"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) All of the above</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Datasets rarely ever flawlessly fit beautifully together seamlessly right out of the box. Before analysis legitimately commences, analysts spend significant time painstakingly smoothing complex lines (<b>Generalization</b>), perfectly stitching fragmented edge tiles seamlessly together (<b>Merging</b>), and standardizing bizarrely messy external file types into structurally compatible environments (<b>Format Conversion</b>). Those initial headache routines neatly encapsulate Preprocessing."}, {"type": "paragraph", "content": "<b>Question 8:</b> The following are also part of processing:"}, {"type": "bullet", "content": "(a) Georeferencing"}, {"type": "bullet", "content": "(b) Interpolation"}, {"type": "bullet", "content": "(c) Image interpretation"}, {"type": "bullet", "content": "(d) None of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Georeferencing</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Prior to extracting sophisticated intelligence from an old scanned historical map through tracing, that raw scanned image floats aimlessly blindly in digital space! Inarguably the most tremendously critical early 'Preprocessing' task is manually anchoring and perfectly aligning those raw historical pixels into accurate coordinate geometries via <b>Georeferencing</b> so the system properly maps it onto the Earth."}, {"type": "paragraph", "content": "<b>Question 9:</b> One type of image fusion / merging technique is based on:"}, {"type": "bullet", "content": "(a) Colour transformations"}, {"type": "bullet", "content": "(b) Image transformations"}, {"type": "bullet", "content": "(c) Geographic transformations"}, {"type": "bullet", "content": "(d) Geometric transformations"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Colour transformations</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Satellites continually beam down various different optical lenses concurrently\u2014like a crystal clear high-resolution black/white photograph combined with a stunning yet incredibly blurry multi-spectral color shot. Analysts highly prefer taking both lenses heavily utilizing mathematical algorithms adjusting Light, Hue, and Saturation merging the strengths together (called Pan-sharpening). These fusion layers heavily rely mathematically upon <b>Colour Transformations</b> (like RGB transitioning to IHS)."}, {"type": "paragraph", "content": "<b>Question 10:</b> Reclassification involves the selection and presentation of a selected layer of data based on the classes or values of a specific:"}, {"type": "bullet", "content": "(a) Attribute"}, {"type": "bullet", "content": "(b) Object"}, {"type": "bullet", "content": "(c) Pixel"}, {"type": "bullet", "content": "(d) Cell"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Attribute</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Assume your polygon map possesses highly detailed numeric population totals cleanly inputted into its hidden tables. Visually inspecting millions of complex numbers gets highly dizzying fast! If we intentionally establish a simple logical rule\u2014coloring any zone exceeding 50,000 residents red, and under blue\u2014we actively 'Reclassify' the visual map layout based strictly upon evaluating that specific hidden dataset column acting as an <b>Attribute</b>."}]}, "assignment_05.json": {"id": "assignment_05", "title": "Week 5: Assignment 5", "blocks": [{"type": "heading", "content": "\ud83d\udcd8 Week 5: Assignment 5"}, {"type": "paragraph", "content": "<b>Question 1:</b> Map overlay operations are based on:"}, {"type": "bullet", "content": "(a) Boolean Logic"}, {"type": "bullet", "content": "(b) Deductive"}, {"type": "bullet", "content": "(c) Inductive"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Boolean Logic</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> When you take two different maps (like a map of forests and a map of steep hills) and 'overlay' them to find where they intersect, the computer strictly evaluates mathematical conditions like 'AND', 'OR', and 'NOT'. This rigid binary framework of evaluating whether overlapping conditions are strictly true or false is globally known as <b>Boolean Logic</b>, named after mathematician George Boole."}, {"type": "paragraph", "content": "<b>Question 2:</b> The intersection A \u2229 B of two sets A and B is the set that contains all elements of A that also belong to B:"}, {"type": "bullet", "content": "(a) False"}, {"type": "bullet", "content": "(b) No change"}, {"type": "bullet", "content": "(c) True"}, {"type": "bullet", "content": "(d) None of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) True</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> This is fundamentally <b>True</b>! In Set Theory, the 'Intersection' symbol (\u2229) acts exactly like the word 'AND'. The intersection basically asks the question: 'Show me ONLY the specific items that exist simultaneously in Box A AND Box B'. Thus, it strictly contains only the elements of A that also exclusively belong to B!"}, {"type": "paragraph", "content": "<b>Question 3:</b> Which overlay operator has been used in the following figure?"}, {"type": "bullet", "content": "(a) AND"}, {"type": "bullet", "content": "(b) OR"}, {"type": "bullet", "content": "(c) NOT"}, {"type": "bullet", "content": "(d) None of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) AND</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Since the figure isn't visible, we conventionally assume a classic Venn diagram showing two overlapping circles (Circle A and Circle B) where only the middle overlapping almond shape is shaded. That exact shaded intersection representing only the area shared simultaneously by both circles visually demonstrates the strict <b>AND</b> operator!"}, {"type": "paragraph", "content": "<b>Question 4:</b> Which is the raster based overlay operation:"}, {"type": "bullet", "content": "(a) Arithmetic"}, {"type": "bullet", "content": "(b) Relational"}, {"type": "bullet", "content": "(c) Conditional"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) All of the above</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Raster maps are essentially giant grids of numbers. Because they are just raw numbers, when you lay two grids over each other, you can beautifully perform <b>Arithmetic</b> (adding pixel values together), evaluate <b>Relational</b> expressions (asking if Pixel A > Pixel B), or run <b>Conditional</b> scripts (If Pixel A is 0, make Pixel B 1). Since all these mathematical maneuvers work flawlessly on number grids, <b>All of the above</b> applies!"}, {"type": "paragraph", "content": "<b>Question 5:</b> Which is neighborhood operation?"}, {"type": "bullet", "content": "(a) Interpolation functions"}, {"type": "bullet", "content": "(b) Topographic functions"}, {"type": "bullet", "content": "(c) Search functions"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) All of the above</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> A 'neighborhood operation' analyzes a specific pixel by intensely looking at the pixels directly touching or surrounding it. <b>Interpolation</b> guesses empty spots based on surrounding anchors. <b>Topographic functions</b> (like calculating slope steepness) absolutely must evaluate how much higher the neighboring pixels are. <b>Search functions</b> scan adjacent areas to find targets. Thus, they <b>All</b> heavily rely on interrogating neighborhoods!"}, {"type": "paragraph", "content": "<b>Question 6:</b> Evaluation of characteristics of an area surrounding a specific location is known as:"}, {"type": "bullet", "content": "(a) Digitization"}, {"type": "bullet", "content": "(b) Neighbourhood operations"}, {"type": "bullet", "content": "(c) Georeferencing"}, {"type": "bullet", "content": "(d) Merging"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Neighbourhood operations</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> The question definition strictly describes an action where a central location is actively analyzing the immediate 'surrounding area'. In spatial analysis textbooks, operations evaluating zones directly outwards orbiting a central focal point are explicitly defined as <b>Neighbourhood operations</b>! Georeferencing is anchoring maps, and merging is combining layers."}, {"type": "paragraph", "content": "<b>Question 7:</b> In which operation it is necessary to indicate one or more target locations, the neighbourhood considered around each target and the type of function to be executed on the attributes within the neighbourhood:"}, {"type": "bullet", "content": "(a) Interpolation functions"}, {"type": "bullet", "content": "(b) Topographic functions"}, {"type": "bullet", "content": "(c) Search functions"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Search functions</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> When you instruct a system to basically 'Drop a pin on a target location, establish a 1-mile search radius around it, and execute a query finding all schools inside', you are explicitly executing <b>Search functions</b>. They distinctively require pinpointing a target, defining a search radius/neighborhood, and applying a specific qualifying attribute filter!"}, {"type": "paragraph", "content": "<b>Question 8:</b> The procedure of estimating unknown values at un-sampled sites using known values of existing observations is known as:"}, {"type": "bullet", "content": "(a) Interpolation functions"}, {"type": "bullet", "content": "(b) Topographic functions"}, {"type": "bullet", "content": "(c) Search functions"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Interpolation functions</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> This is the exact classic definition of <b>Interpolation</b>! Imagine you know the temperature is 10\u00b0 at Station A and 20\u00b0 at Station B. If I force you to guess the temperature exactly halfway between them, you would logically estimate 15\u00b0. That mathematical estimation predicting blank, unsampled gaps by cleverly blending the known existing anchors surrounding it is practically the definition of Interpolation!"}, {"type": "paragraph", "content": "<b>Question 9:</b> The \u2026\u2026\u2026\u2026 of a surface can be represented in a digital elevation model (DEM):"}, {"type": "bullet", "content": "(a) Photography"}, {"type": "bullet", "content": "(b) Petrography"}, {"type": "bullet", "content": "(c) Topography"}, {"type": "bullet", "content": "(d) Topology"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Topography</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> A DEM (Digital Elevation Model) is structurally a 3D digital grid where every pixel mathematically records sea-level elevation. The formal scientific term describing the physical undulating bumps, mountains, valleys, and slopes covering the Earth's surface mathematically is <b>Topography</b>. Photography handles visuals, and Topology governs network connections\u2014neither of which strictly requires elevations!"}, {"type": "paragraph", "content": "<b>Question 10:</b> Spatial searching based on certain criteria/condition is known as:"}, {"type": "bullet", "content": "(a) Buffer analysis"}, {"type": "bullet", "content": "(b) Safer analysis"}, {"type": "bullet", "content": "(c) Suffer analysis"}, {"type": "bullet", "content": "(d) Offer analysis"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Buffer analysis</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> If a law says 'No alcohol sales within 500 meters of a school', how do we spatially search for violations? We draw a rigid 500-meter boundary ringing outwards around every school, then highlight any stores violating that spatial condition. Drawing these critical condition-based spatial proximity protection rings is universally termed <b>Buffer analysis</b>!"}]}, "assignment_06.json": {"id": "assignment_06", "title": "Week 6: Assignment 6", "blocks": [{"type": "heading", "content": "\ud83d\udcd8 Week 6: Assignment 6"}, {"type": "paragraph", "content": "<b>Question 1:</b> How many kinds of network elements are currently known in GIS?"}, {"type": "bullet", "content": "(a) 1"}, {"type": "bullet", "content": "(b) 2"}, {"type": "bullet", "content": "(c) 3"}, {"type": "bullet", "content": "(d) 4"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) 2</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> In a digital network structure (like mapping a city's road system or plumbing grid), the entire massive web mathematically breaks down into only <b>2</b> extremely simple base elements. We have 'Edges' (the actual straight lines representing roads or pipes that carry flow) and we have 'Junctions' (the nodes or intersections that literally connect the edges together). Everything else is built off these two!"}, {"type": "paragraph", "content": "<b>Question 2:</b> \u2026\u2026\u2026.connect edges and facilitate navigation from one edge to another:"}, {"type": "bullet", "content": "(a) Edges"}, {"type": "bullet", "content": "(b) Junctions"}, {"type": "bullet", "content": "(c) Turns"}, {"type": "bullet", "content": "(d) None of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Junctions</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Imagine driving down a long straight highway (an Edge). If you desperately want to transition onto a totally different intersecting highway (another Edge), you absolutely cannot seamlessly jump between them unless a physical connecting intersection exists! These critical connective hinges uniting different flow paths and permitting navigational transfers between edges are scientifically called <b>Junctions</b>."}, {"type": "paragraph", "content": "<b>Question 3:</b> The movement of people, transportation and distribution of services and allocation delivery of resources occurs through a:"}, {"type": "bullet", "content": "(a) Geographic system"}, {"type": "bullet", "content": "(b) Geometric system"}, {"type": "bullet", "content": "(c) Geodesic system"}, {"type": "bullet", "content": "(d) Network system"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) Network system</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> While Geography handles wide-open spaces, moving tangible things sequentially along strict interconnected pathways\u2014like buses along city routes, blood rushing through veins, or electricity buzzing rigidly down grid wires\u2014happens strictly via continuous mathematical channels. This highly regulated, edge-to-junction pathway architecture routing flow is universally termed a <b>Network System</b>."}, {"type": "paragraph", "content": "<b>Question 4:</b> The determination of the shortest path between connected points or nodes within the network based on attribute values is often referred to as:"}, {"type": "bullet", "content": "(a) Route optimization"}, {"type": "bullet", "content": "(b) Relational optimization"}, {"type": "bullet", "content": "(c) Conditional optimization"}, {"type": "bullet", "content": "(d) Conceptual optimization"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Route optimization</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Whenever your GPS app (like Google Maps) actively calculates the fastest way to get you home, it mathematically evaluates millions of branching road possibilities, strictly minimizing 'costs' like travel minutes or distance miles. Finding the absolute tightest, shortest, least 'costly' thread cleanly through a web of nodes is famously termed <b>Route Optimization</b>."}, {"type": "paragraph", "content": "<b>Question 5:</b> In which analysis four components (a set of resources, location of resources, a destination and a set of constraints) are usually considered:"}, {"type": "bullet", "content": "(a) Buffer analysis"}, {"type": "bullet", "content": "(b) Geometric analysis"}, {"type": "bullet", "content": "(c) Geodesic analysis"}, {"type": "bullet", "content": "(d) Network analysis"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) Network analysis</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Think about managing a fleet of delivery trucks! You have the trucks (Resources), their garage depot (Location), the houses awaiting packages (Destinations), and critical speed limits or traffic jams (Constraints). Intelligently balancing incredibly complex routing requirements heavily constrained by these exact four factors forms the absolute beating heart of <b>Network Analysis</b>."}, {"type": "paragraph", "content": "<b>Question 6:</b> The process of organizing data into group / categories according to shared qualities or characteristics is called as:"}, {"type": "bullet", "content": "(a) Modification"}, {"type": "bullet", "content": "(b) Classification"}, {"type": "bullet", "content": "(c) Ossification"}, {"type": "bullet", "content": "(d) Ramification"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Classification</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Imagine staring at a list of 1,000 messy city temperatures. To make sense of the chaotic noise visually, you might actively sort those 1,000 numbers into cleanly defined groups: 'Below Freezing', 'Moderate', and 'Hot'. Identifying shared qualities and aggressively clumping chaotic data cleanly into manageable themed categories is the fundamental definition of <b>Classification</b>."}, {"type": "paragraph", "content": "<b>Question 7:</b> For attribute categorization, how many types are commonly used in GIS:"}, {"type": "bullet", "content": "(a) 3"}, {"type": "bullet", "content": "(b) 4"}, {"type": "bullet", "content": "(c) 5"}, {"type": "bullet", "content": "(d) 6"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) 5</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Though GIS possesses heavy customization, there are typically <b>5</b> globally-standard methods analysts heavily rely upon mathematically breaking numeric attribute data into visual mapping classes: Natural Breaks (Jenks), Equal Interval, Quantile, Standard Deviation, and Manual (or Geometrical) classification. Each tells a remarkably different story with the exact same numbers!"}, {"type": "paragraph", "content": "<b>Question 8:</b> The method in which each class contains the same number of features is known as:"}, {"type": "bullet", "content": "(a) Natural Breaks (Jenks)"}, {"type": "bullet", "content": "(b) Quantile"}, {"type": "bullet", "content": "(c) Equal Area"}, {"type": "bullet", "content": "(d) Standard Deviations"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Quantile</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> If you have 100 student exam scores and strictly want to divide them into 4 groups (classes) representing the map colors, the <b>Quantile</b> mathematically forces an exact, uniform number of features inside every single category\u2014meaning it forces precisely 25 students into each of the 4 buckets regardless of how wildly huge the gap in their test scores is!"}, {"type": "paragraph", "content": "<b>Question 9:</b> The method in which the mean value is found and then class breaks above and below the mean at intervals of either 1/4, 1/2, or 1 standard deviations are placed until all the data values are contained within the classes is:"}, {"type": "bullet", "content": "(a) Quantile"}, {"type": "bullet", "content": "(b) Equal Area"}, {"type": "bullet", "content": "(c) Standard Deviations"}, {"type": "bullet", "content": "(d) Geometrical interval"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) Standard Deviations</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Very straightforward naming here! When the algorithm mathematically averages all the data to find the absolute numeric 'mean' center, and then intentionally establishes its bucket lines strictly scaling outwards utilizing measured chunks of identical mathematical variance, it is unabashedly employing classic statistical <b>Standard Deviations</b>."}, {"type": "paragraph", "content": "<b>Question 10:</b> Data anomalies includes:"}, {"type": "bullet", "content": "(a) Modification"}, {"type": "bullet", "content": "(b) Insertion"}, {"type": "bullet", "content": "(c) Deletion"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) All of the above</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> In database architecture, if a structural table is horribly designed without strict rules, terrible corruptions called 'Anomalies' occur. If updating one employee's address arbitrarily corrupts another, that's a <b>Modification</b> anomaly. If you literally can't add a new department without assigning it a dummy employee first, that's an <b>Insertion</b> anomaly. Deleting a record wiping out critical unintended parent data is a <b>Deletion</b> anomaly. Hence, they encapsulate <b>All of the above</b>!"}]}, "assignment_07.json": {"id": "assignment_07", "title": "Week 7: Assignment 7", "blocks": [{"type": "heading", "content": "\ud83d\udcd8 Week 7: Assignment 7"}, {"type": "paragraph", "content": "<b>Question 1:</b> Which database model is logically represented by an upside down tree?"}, {"type": "bullet", "content": "(a) Hierarchical"}, {"type": "bullet", "content": "(b) Relational"}, {"type": "bullet", "content": "(c) Network"}, {"type": "bullet", "content": "(d) Object-oriented"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Hierarchical</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Imagine a family tree starting with an old grandparent at the very top, branching downward continuously into parents and then grandchildren. In databases, when a rigid 'Parent' record branches perfectly downward into subservient 'Child' records without crossing paths, this strictly structured, top-down, upside-down tree format is classically known as the <b>Hierarchical</b> model."}, {"type": "paragraph", "content": "<b>Question 2:</b> In which database model tables are related by sharing common entity characteristic:"}, {"type": "bullet", "content": "(a) Hierarchical"}, {"type": "bullet", "content": "(b) Relational"}, {"type": "bullet", "content": "(c) Network"}, {"type": "bullet", "content": "(d) Object-oriented"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Relational</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> A 'Relational' database is built almost entirely on the brilliant concept of bridges! If Table A lists Employees and their 'Employee_ID', and Table B lists Payroll linked strictly to 'Employee_ID', the system seamlessly joins the two physically separate tables together because they share that exact common entity characteristic acting as the bridge linking their relations!"}, {"type": "paragraph", "content": "<b>Question 3:</b> A cell is assigned the \u2026\u2026.. value if there is either no information or insufficient information about the characteristics of the location it represents:"}, {"type": "bullet", "content": "(a) Zero"}, {"type": "bullet", "content": "(b) Meta data"}, {"type": "bullet", "content": "(c) Some data"}, {"type": "bullet", "content": "(d) NoData"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) NoData</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> In mathematics, '0' is actually a highly specific valid number (like 0 degrees Celsius). If a satellite's camera simply malfunctioned momentarily over a lake and failed to measure the temperature entirely, plugging in '0' would mathematically ruin regional average temperature calculations! Instead, GIS explicitly flags that un-measured blank pixel with the absolute <b>NoData</b> tag, meaning 'ignore this completely in calculations; it's physically missing'."}, {"type": "paragraph", "content": "<b>Question 4:</b> Initially SRTM-DEM has voids which were filled with:"}, {"type": "bullet", "content": "(a) NoData"}, {"type": "bullet", "content": "(b) Zero"}, {"type": "bullet", "content": "(c) Meta data"}, {"type": "bullet", "content": "(d) Some data"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) NoData</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> When the Space Shuttle Radar Topography Mission (SRTM) mapped the Earth, radar beams sometimes couldn't penetrate heavy clouds, deep steep canyons, or totally smooth mirror-like waters. These complete failures to measure bouncing signals essentially left massive gaping holes ('voids') in the final elevation map. NASA formally tagged these empty un-measured pixel holes with explicit <b>NoData</b> values to strictly indicate the satellite was blinded there."}, {"type": "paragraph", "content": "<b>Question 5:</b> A way to flatten a globe's surface into a plane in order to make a map:"}, {"type": "bullet", "content": "(a) Map enlargement"}, {"type": "bullet", "content": "(b) Map reduction"}, {"type": "bullet", "content": "(c) Map production"}, {"type": "bullet", "content": "(d) Map projection"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) Map projection</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> You geometrically cannot press an orange peel perfectly flat onto a tight table without it horrifically stretching or brutally ripping! The complex mathematical algorithms used to somehow 'project' or translate the curved 3D spherical Earth onto a fundamentally flat 2D piece of paper (or flat digital screen) is exclusively defined as creating a <b>Map projection</b>."}, {"type": "paragraph", "content": "<b>Question 6:</b> Maps are models of:"}, {"type": "bullet", "content": "(a) Virtually"}, {"type": "bullet", "content": "(b) Reality"}, {"type": "bullet", "content": "(c) Rituality"}, {"type": "bullet", "content": "(d) Potentiality"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Reality</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> We build maps directly attempting to mimic the actual physical universe around us. While a map simplifies things (you don't draw every crack in a sidewalk), its fundamental purpose is exclusively acting as a functional geographic scale model attempting to represent the physical <b>Reality</b> of the Earth!"}, {"type": "paragraph", "content": "<b>Question 7:</b> Map projections involve distortions in:"}, {"type": "bullet", "content": "(a) Shape"}, {"type": "bullet", "content": "(b) Size"}, {"type": "bullet", "content": "(c) Distance"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) All of the above</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Remember flattening the orange peel? Every single time you mathematically flatten a sphere, absolute mathematical compromise is legally required. It is geometrically impossible to build a perfect flat map! You are forced to choose what to sacrifice. Some map projections brutally distort geometric <b>Shapes</b>, others violently warp continent <b>Sizes</b>, and others completely scramble exact <b>Distances</b>. Hence, <b>All of the above</b> inevitably suffer."}, {"type": "paragraph", "content": "<b>Question 8:</b> Following is a type of map projection:"}, {"type": "bullet", "content": "(a) Cylindrical"}, {"type": "bullet", "content": "(b) Conic"}, {"type": "bullet", "content": "(c) Azimuthal"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (d) All of the above</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> There are three classical mathematical families dictating how we stretch mapping paper around the globe. Imagine literally wrapping a sheet of paper around a desktop globe: You can wrap it straight as a tube cylinder (<b>Cylindrical</b>), twist it like a pointy wizard hat wrapping halfway down (<b>Conic</b>), or just brutally slap a rigid flat sheet tangent against a single pole (<b>Azimuthal/Planar</b>). They are <b>All</b> standard projection families!"}, {"type": "paragraph", "content": "<b>Question 9:</b> Which projection preserves right angles between lines of latitude and longitude and are primarily used because they preserve direction:"}, {"type": "bullet", "content": "(a) Cylindrical"}, {"type": "bullet", "content": "(b) Conic"}, {"type": "bullet", "content": "(c) Azimuthal"}, {"type": "bullet", "content": "(d) All of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (a) Cylindrical</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> The incredibly famous Mercator projection used tightly by ancient nautical ship navigators relies heavily upon perfectly straight right angles. This is created by cleanly wrapping a tube straight around the equator. In this <b>Cylindrical</b> method, latitudes and longitudes always cleanly intersect at perfect 90-degree right angles, meaning a compass line drawn physically on the map translates perfectly realistically to steering a ship!"}, {"type": "paragraph", "content": "<b>Question 10:</b> The UTM map projection system consists of \u2026\u2026 zones, each 6-degrees of longitude in width:"}, {"type": "bullet", "content": "(a) 50"}, {"type": "bullet", "content": "(b) 60"}, {"type": "bullet", "content": "(c) 70"}, {"type": "bullet", "content": "(d) 80"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) 60</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> The massive Universal Transverse Mercator (UTM) system doesn't try to cram the whole warped globe into one flat map. Instead, it cleverly mathematically slices the globe straight downwards into 60 perfectly equal vertical 'melon slices' called zones. Since a full global circle is 360 degrees, dividing those 360 degrees entirely by 6-degree slices results precisely in essentially creating <b>60</b> independent mapping zones!"}]}, "assignment_08.json": {"id": "assignment_08", "title": "Week 8: Assignment 8", "blocks": [{"type": "heading", "content": "\ud83d\udcd8 Week 8: Assignment 8"}, {"type": "paragraph", "content": "<b>Question 1:</b> Higher spatial resolution raster dataset will allow:"}, {"type": "bullet", "content": "(a) To distinguish far spaced objects clearly"}, {"type": "bullet", "content": "(b) No changes in the visibility / interpretation"}, {"type": "bullet", "content": "(c) To distinguish closed spaced objects clearly"}, {"type": "bullet", "content": "(d) None of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (c) To distinguish closed spaced objects clearly</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> If you have a blurry low-resolution camera with large blocky 100-meter pixels, two houses situated 5 meters apart completely bleed together into one single mushy pixel. But if you greatly increase the spatial resolution (creating tiny 1-meter pixels), suddenly the sharp crisp pixels easily slide between the houses. Thus, high resolution distinctly allows you <b>To distinguish closely spaced objects clearly</b> separating them effortlessly!"}, {"type": "paragraph", "content": "<b>Question 2:</b> 10 m spatial resolution is \u2026\u2026. Over 20 m spatial resolution data:"}, {"type": "bullet", "content": "(a) Inferior"}, {"type": "bullet", "content": "(b) Better"}, {"type": "bullet", "content": "(c) No change"}, {"type": "bullet", "content": "(d) None of the above"}, {"type": "paragraph", "content": "<mark style='background-color: #fce72b; color: #000; padding: 2px 6px; border-radius: 4px;'>\u2705 <b>Correct Answer: (b) Better</b></mark>"}, {"type": "paragraph", "content": "\ud83d\udc68\u200d\ud83c\udfeb <i>Teacher's Explanation:</i> Spatial resolution numbers represent the physical size of one pixel on the ground. A 20m resolution means one pixel represents a massive 20-meter by 20-meter area\u2014it will comp
