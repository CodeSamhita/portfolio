<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPTEL Geography Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="data.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body>
    <div class="layoutWrapper" id="app-shell">
        <button class="navOverlay" id="nav-overlay" type="button" aria-label="Close lecture navigation"></button>
        <aside class="sidebar" id="sidebar">
            <div class="sidebarHeader">
                <p class="sidebarKicker">NPTEL GIS</p>
                <div class="sidebarHeaderRow">
                    <div>
                        <h1>Lecture Navigator</h1>
                        <p id="lecture-count">Loading lectures...</p>
                    </div>
                    <button class="sidebarClose" id="menu-close" type="button" aria-label="Close lecture navigation">Close</button>
                </div>
                <div class="searchPanel">
                    <label class="searchLabel" for="lecture-search">Find keyword</label>
                    <div class="searchFieldWrap">
                        <input class="searchInput" id="lecture-search" type="search" placeholder="Search topics, headings, or points" aria-label="Find keyword in lectures">
                        <button class="searchClear" id="search-clear" type="button">Clear</button>
                    </div>
                    <p class="searchSummary" id="search-summary">Loading searchable notes...</p>
                </div>
            </div>
            <div class="lectureList" id="lecture-list">
                <!-- Sidebar items rendered dynamically -->
            </div>
        </aside>

        <main class="mainContent">
            <div class="mobileToolbar">
                <div class="mobileToolbarTop">
                    <button class="menuButton" id="menu-toggle" type="button">Browse lectures</button>
                    <p class="currentLecture" id="current-lecture-label">All lectures</p>
                </div>
                <div class="mobileSearch">
                    <div class="searchFieldWrap">
                        <input class="searchInput" id="lecture-search-mobile" type="search" placeholder="Find keyword" aria-label="Find keyword in lectures">
                        <button class="searchClear" id="search-clear-mobile" type="button">Clear</button>
                    </div>
                </div>
            </div>
            <div id="content-container">
                <div class="emptyState">
                    <h2>Loading lectures</h2>
                    <p>Preparing the continuous notes stream and search index.</p>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
