<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS Mastery | Lecture Summaries</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Same CSS as Main App -->
    <link rel="stylesheet" href="static/css/style.css">
    <style>
        .module-group {
            margin-bottom: 25px;
        }
        .module-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            padding: 10px 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .lecture-card {
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: white;
            overflow: hidden;
        }
        .lecture-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-color: var(--primary);
        }
        .lecture-id {
            background: var(--primary);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .summary-text {
            line-height: 1.6;
            color: var(--text);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar shadow-lg">
            <div class="sidebar-header">
                <i class="fas fa-globe-americas logo-icon"></i>
                <span class="logo-text">GIS Study</span>
            </div>
            <nav class="set-nav">
                <p class="nav-label">QUICK LINKS</p>
                <div class="set-list mb-4">
                    <a href="index.html" class="set-item text-decoration-none">
                        <i class="fas fa-vial"></i>
                        <div class="set-name">Practice Quiz</div>
                    </a>
                </div>
                
                <p class="nav-label">LECTURE MODULES</p>
                <div id="moduleNav" class="set-list">
                    <!-- Dynamic Modules -->
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <h1 id="pageTitle">GIS Lecture Summaries</h1>
                <div class="stats-pills">
                    <div class="pill score-pill"><i class="fas fa-book-open"></i> 50 Lectures</div>
                </div>
            </header>

            <div class="container-fluid py-4">
                <div id="summaryDashboard">
                    <!-- Injected Content -->
                    <div class="row" id="summariesGrid">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/summaries_data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const moduleNav = document.getElementById('moduleNav');
            const summariesGrid = document.getElementById('summariesGrid');
            const pageTitle = document.getElementById('pageTitle');

            // Render Sidebar
            SUMMARIES_DATA.forEach((module, idx) => {
                const item = document.createElement('div');
                item.className = 'set-item';
                item.innerHTML = `
                    <i class="fas fa-folder-open"></i>
                    <div class="set-name">Module ${idx + 1}</div>
                `;
                item.onclick = () => renderModule(idx);
                moduleNav.appendChild(item);
            });

            function renderModule(idx) {
                const module = SUMMARIES_DATA[idx];
                pageTitle.innerText = module.moduleName;
                summariesGrid.innerHTML = '';
                
                // Active state in sidebar
                document.querySelectorAll('.set-item').forEach((btn, i) => {
                    if(i > 0) btn.classList.toggle('active', (i-1) === idx);
                });

                module.lectures.forEach(lecture => {
                    const col = document.createElement('div');
                    col.className = 'col-md-6 col-lg-4 mb-4';
                    col.innerHTML = `
                        <div class="lecture-card h-100 p-4">
                            <div class="d-flex align-items-center gap-3 mb-3">
                                <div class="lecture-id">L${lecture.id}</div>
                                <h5 class="mb-0 fw-bold">${lecture.topic}</h5>
                            </div>
                            <p class="summary-text text-muted mb-0 small">
                                ${lecture.summary}
                            </p>
                        </div>
                    `;
                    summariesGrid.appendChild(col);
                });
                
                window.scrollTo({top: 0, behavior: 'smooth'});
            }

            // Load first module by default
            renderModule(0);
        });
    </script>
</body>
</html>
