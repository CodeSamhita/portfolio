<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aditya Sharma | Upgrading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="portfolio v6/style.css" />
</head>

<body class="dark-mode"
  style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">

  <div class="ambient-background" aria-hidden="true">
    <div class="glow-orb orb-primary"></div>
    <div class="glow-orb orb-secondary"></div>
    <div class="glow-orb orb-accent"></div>
    <div class="noise-overlay"></div>
  </div>

  <main class="container reveal-up is-visible" style="max-width: 800px; z-index: 10;">
    <article class="glass-panel text-center" style="padding: 4rem 2rem;">
      <i class="fas fa-hammer text-gradient mb-4" style="font-size: 3rem;"></i>
      <h1 class="hero-title text-gradient" style="font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: 1rem;">System
        Upgrades in Progress</h1>
      <p class="section-description mx-auto" style="font-size: 1.1rem; max-width: 600px;">
        I am currently engineering <strong>New Portfolio </strong>. It introduces a modernized glassmorphic design system
        and completely overhauled backend logic.
      </p>

      <div class="mt-5" style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
        <a href="portfolio v4/index.html" class="btn btn-outline" style="min-width: 180px;"><i
            class="fas fa-history"></i> Visit Old page</a>
        <a href="portfolio v6/index.html" class="btn btn-glow" style="min-width: 180px;"><i class="fas fa-flask"></i>
          new page(Beta)</a>
      </div>

      <div style="margin-top: 3rem;">
        <div class="loader-spinner mx-auto"
          style="width: 32px; height: 32px; border-width: 3px; border-top-color: var(--cyan);"></div>
        <p class="admin-note mt-3">Executing UI changes. Please stand by.</p>
      </div>
    </article>
  </main>

  <style>
    body {
      background-color: #050505;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      margin: 0;
    }

    .glass-panel {
      background: rgba(10, 25, 47, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .text-gradient {
      background: linear-gradient(135deg, #fff 0%, #87eeff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-glow {
      background: rgba(135, 238, 255, 0.1);
      color: #87eeff;
      border: 1px solid rgba(135, 238, 255, 0.3);
      box-shadow: 0 0 15px rgba(135, 238, 255, 0.1);
    }

    .btn-glow:hover {
      background: rgba(135, 238, 255, 0.2);
      box-shadow: 0 0 25px rgba(135, 238, 255, 0.3);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: #a8b2d1;
      border: 1px solid rgba(168, 178, 209, 0.3);
    }

    .btn-outline:hover {
      border-color: #87eeff;
      color: #87eeff;
      transform: translateY(-2px);
    }

    .admin-note {
      color: #8892b0;
      font-size: 0.9rem;
    }

    .loader-spinner {
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #87eeff;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

</body>

</html>
