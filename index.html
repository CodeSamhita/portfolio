<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title>Aditya Sharma — Loading Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0a06;
            --ink: #f7f2e9;
            --amber: #eaa64f;
            --terra: #d98a6b;
            --card: #1c1813;
        }

        body {
            font-family: 'Bricolage Grotesque', sans-serif;
            background: var(--bg);
            overflow: hidden;
            color: var(--ink);
        }

        /* --- Ambient warm background --- */
        .ambient-background {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            background-color: var(--bg);
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: float 20s infinite alternate ease-in-out;
        }

        .orb-primary {
            width: 600px;
            height: 600px;
            top: -10%;
            right: -10%;
            background: radial-gradient(circle, #eaa64f 0%, transparent 70%);
        }

        .orb-secondary {
            width: 500px;
            height: 500px;
            bottom: -5%;
            left: -10%;
            background: radial-gradient(circle, #d98a6b 0%, transparent 70%);
            animation-delay: -5s;
        }

        .orb-accent {
            width: 400px;
            height: 400px;
            top: 40%;
            left: 40%;
            background: radial-gradient(circle, #f0c07a 0%, transparent 70%);
            opacity: 0.18;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* --- Main Content --- */
        #main-content {
            opacity: 0;
            transition: opacity 1s ease;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        #main-content.loaded {
            opacity: 1;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: transparent;
        }

        .card-float {
            animation: float-card 6s ease-in-out infinite;
            transition: transform 0.4s ease-out;
        }

        @keyframes float-card {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .profile-pulse {
            animation: pulse-glow 3s infinite alternate;
            border-color: var(--amber);
        }

        @keyframes pulse-glow {
            from { box-shadow: 0 0 10px rgba(235, 167, 80, 0.4), 0 0 20px rgba(235,167,80,0.8); }
            to { box-shadow: 0 0 20px rgba(235, 167, 80, 0.6), 0 0 40px rgba(235,167,80,0.9); }
        }

        /* --- Icon Animations --- */
        @keyframes wave-jump {
            0% { transform: translateY(0); }
            20% { transform: translateY(-15px); }
            40% { transform: translateY(0); }
            100% { transform: translateY(0); }
        }

        .social-icon {
            animation: wave-jump 2.5s ease-in-out infinite;
            transition: transform 0.2s ease;
        }

        .social-icon:nth-child(1) { animation-delay: 0s; }
        .social-icon:nth-child(2) { animation-delay: 0.2s; }
        .social-icon:nth-child(3) { animation-delay: 0.4s; }
        .social-icon:nth-child(4) { animation-delay: 0.6s; }
        .social-icon:nth-child(5) { animation-delay: 0.8s; }

        .social-icon:hover {
            animation: none;
            transform: translateY(0) scale(1.1);
        }

        /* --- Loading bar --- */
        .load-track {
            height: 6px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }

        .load-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--terra), var(--amber));
            box-shadow: 0 0 14px rgba(235,167,80,0.55);
            transition: width 0.35s cubic-bezier(.2,.8,.2,1);
        }

        .mono {
            font-family: 'IBM Plex Mono', monospace;
        }

        .serif {
            font-family: 'Fraunces', serif;
        }

        .enter-btn[disabled] {
            cursor: progress;
            opacity: 0.8;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(235,167,80,0.3);
            border-top-color: var(--amber);
            animation: spin 0.7s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Share Toast --- */
        #share-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(28, 24, 19, 0.95);
            border: 1px solid rgba(235, 167, 80, 0.35);
            color: var(--ink);
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #share-toast.show { opacity: 1; visibility: visible; }

        #main-content::-webkit-scrollbar { width: 8px; }
        #main-content::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); }
        #main-content::-webkit-scrollbar-thumb { background: rgba(235, 167, 80, 0.3); border-radius: 4px; }
        #main-content::-webkit-scrollbar-thumb:hover { background: rgba(235, 167, 80, 0.6); }

        #preload-frame {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            border: 0;
            left: -9999px;
        }
    </style>
</head>

    <script>
        // ===== Destination =====
        const PORTFOLIO_URL = "portfolio_v7_1/Aditya Sharma - Portfolio.dc.html";
        const MIN_SPLASH_MS = 1600;   // keep the loved splash on screen at least this long
        const SAFETY_MS = 14000;      // hand off anyway if loading stalls

        // ===== Particle background =====
        let canvas, ctx, particles, mouse;

        class Particle {
            constructor(x, y, dx, dy, size, color) {
                this.x = x; this.y = y; this.directionX = dx; this.directionY = dy; this.size = size; this.color = color;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            update() {
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
                if (mouse.x && mouse.y) {
                    let dx = mouse.x - this.x, dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius + this.size) {
                        if (mouse.x < this.x && this.x < canvas.width - this.size * 10) this.x += 3;
                        if (mouse.x > this.x && this.x > this.size * 10) this.x -= 3;
                        if (mouse.y < this.y && this.y < canvas.height - this.size * 10) this.y += 3;
                        if (mouse.y > this.y && this.y > this.size * 10) this.y -= 3;
                    }
                }
                this.x += this.directionX; this.y += this.directionY; this.draw();
            }
        }

        function initParticles() {
            particles = [];
            let n = (canvas.height * canvas.width) / 9000;
            for (let i = 0; i < n; i++) {
                let size = (Math.random() * 2) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                particles.push(new Particle(x, y, (Math.random() * .4) - .2, (Math.random() * .4) - .2, size, 'rgba(235, 167, 80, 0.4)'));
            }
        }

        function connectParticles() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let d = ((particles[a].x - particles[b].x) ** 2) + ((particles[a].y - particles[b].y) ** 2);
                    if (d < (canvas.width / 7) * (canvas.height / 7)) {
                        let o = 1 - (d / 20000);
                        ctx.strokeStyle = `rgba(235, 167, 80, ${o * 0.3})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            requestAnimationFrame(animateParticles);
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            for (let i = 0; i < particles.length; i++) particles[i].update();
            connectParticles();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        // ===== Loading / handoff orchestration =====
        const startTime = Date.now();
        let progress = 0;
        let portfolioReady = false;
        let handedOff = false;

        const fill = () => document.getElementById('load-fill');
        const pct = () => document.getElementById('load-pct');
        const statusEl = () => document.getElementById('load-status');

        const STAGES = [
            "Connecting\u2026",
            "Fetching profile & projects\u2026",
            "Loading imagery\u2026",
            "Preparing animations\u2026",
            "Almost ready\u2026"
        ];

        function setProgress(p, label) {
            progress = Math.max(progress, Math.min(p, 100));
            if (fill()) fill().style.width = progress + '%';
            if (pct()) pct().textContent = Math.round(progress) + '%';
            if (label && statusEl()) statusEl().textContent = label;
        }

        // Smoothly creep the bar while the real frame loads, capped at 90% until ready.
        let creepTimer = setInterval(() => {
            if (portfolioReady) return;
            const cap = 90;
            if (progress < cap) {
                const step = progress < 60 ? 2.2 : 0.7;
                const next = Math.min(progress + Math.random() * step, cap);
                const stage = STAGES[Math.min(Math.floor(next / 20), STAGES.length - 1)];
                setProgress(next, stage);
            }
        }, 220);

        function finishLoad() {
            if (portfolioReady) return;
            portfolioReady = true;
            clearInterval(creepTimer);
            setProgress(100, "Ready");

            const btn = document.getElementById('enter-btn');
            const label = document.getElementById('enter-label');
            const spin = btn.querySelector('.spinner');
            if (spin) spin.style.display = 'none';
            label.textContent = 'Enter Portfolio \u2192';
            btn.style.pointerEvents = 'auto';
            btn.removeAttribute('aria-disabled');
            btn.style.background = 'rgba(235,167,80,0.22)';
            btn.style.boxShadow = '0 0 25px rgba(235,167,80,0.3)';

            // Honour minimum splash time, then hand off automatically.
            const elapsed = Date.now() - startTime;
            const wait = Math.max(MIN_SPLASH_MS - elapsed, 650);
            setTimeout(handoff, wait);
        }

        function handoff() {
            if (handedOff) return;
            handedOff = true;
            const mc = document.getElementById('main-content');
            mc.style.transition = 'opacity 0.6s ease';
            mc.style.opacity = '0';
            setTimeout(() => { window.location.href = PORTFOLIO_URL; }, 600);
        }

        window.onload = () => {
            const mainContent = document.getElementById('main-content');
            const tiltCard = document.getElementById('tilt-card');
            const shareButton = document.getElementById('share-button');
            const shareToast = document.getElementById('share-toast');
            const frame = document.getElementById('preload-frame');

            canvas = document.getElementById('particle-canvas');
            ctx = canvas.getContext('2d');
            mouse = { x: null, y: null, radius: 150 };

            mainContent.classList.add('loaded');
            setProgress(8, STAGES[0]);

            // Kick off the real preload: load the portfolio (and everything it pulls in) in a hidden frame.
            // When the frame's load event fires, the portfolio document + its subresources are cached.
            frame.addEventListener('load', () => {
                // Give the portfolio's own scripts a moment to fetch data/fonts, then finish.
                setTimeout(finishLoad, 500);
            });
            frame.addEventListener('error', finishLoad);
            try {
                frame.src = PORTFOLIO_URL;
            } catch (e) {
                finishLoad();
            }

            // Safety net so the user is never stuck.
            setTimeout(() => { if (!portfolioReady) finishLoad(); }, SAFETY_MS);

            // Tilt interaction
            tiltCard.addEventListener('mousemove', (e) => {
                const { left, top, width, height } = tiltCard.getBoundingClientRect();
                const x = e.clientX - left - width / 2;
                const y = e.clientY - top - height / 2;
                tiltCard.style.transform = `perspective(1500px) rotateX(${(y / height) * -20}deg) rotateY(${(x / width) * 20}deg) scale3d(1.02, 1.02, 1.02)`;
            });
            tiltCard.addEventListener('mouseleave', () => {
                tiltCard.style.transform = 'perspective(1500px) rotateX(0) rotateY(0) scale3d(1, 1, 1)';
            });

            // Share button
            shareButton.addEventListener('click', async () => {
                const shareData = {
                    title: 'Aditya Sharma - Portfolio',
                    text: 'Check out Aditya Sharma\'s portfolio!',
                    url: window.location.href
                };
                if (navigator.share) {
                    try { await navigator.share(shareData); } catch (err) { /* cancelled */ }
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = window.location.href;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    shareToast.classList.add('show');
                    setTimeout(() => shareToast.classList.remove('show'), 2000);
                }
            });

            window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
            window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
            window.addEventListener('resize', resizeCanvas);

            resizeCanvas();
            animateParticles();
        };
    </script>
</body>

</html>
