<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title>Resume - Aditya Sharma</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&family=Lato:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* --- Embedded CSS from resume-style.css --- */
        :root {
          --bg-color: #050505;
          --bg-surface: #121214;
          --border-glass: rgba(255, 255, 255, 0.08);
          --text-main: #fcfcfc;
          --text-muted: #a1a1aa;
          --accent-primary: #8b5cf6;
          --accent-secondary: #0ea5e9;
          --radius-md: 16px;
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body {
          font-family: 'Inter', sans-serif;
          background-color: var(--bg-color);
          color: var(--text-main);
          line-height: 1.6;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 3rem 1rem;
        }

        h1, h2, h3, h4 {
          font-family: 'Outfit', sans-serif;
          color: var(--text-main);
          margin-bottom: 0.5rem;
        }

        a {
          color: var(--accent-secondary);
          text-decoration: none;
          transition: color 0.2s;
        }

        a:hover {
          color: var(--accent-primary);
        }

        /* Nav Panel Settings */
        .nav-panel {
            position: fixed; top: 15px; right: 15px;
            background: #ffffff; border: 1px solid #ddd;
            padding: 8px 15px; border-radius: 20px; font-size: 13px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000;
            color: #333;
        }
        .nav-panel a { text-decoration: none; color: #666; margin: 0 5px; }
        .nav-panel a.active { color: #000; font-weight: bold; pointer-events: none; }
        @media print { .nav-panel { display: none !important; } }

        /* Container to be exported */
        .resume-container {
          width: 100%;
          max-width: 900px;
          background: var(--bg-surface);
          border: 1px solid var(--border-glass);
          border-radius: var(--radius-md);
          display: flex;
          flex-direction: row;
          overflow: hidden;
          box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* Left Column */
        .left-column {
          width: 35%;
          background: rgba(255, 255, 255, 0.02);
          padding: 3rem 2rem;
          border-right: 1px solid var(--border-glass);
          display: flex;
          flex-direction: column;
          gap: 2rem;
        }

        .profile-section {
          text-align: center;
        }

        .resume-profile-img {
          width: 140px;
          height: 140px;
          border-radius: 50%;
          object-fit: cover;
          margin-bottom: 1.5rem;
          border: 4px solid var(--bg-surface);
          box-shadow: 0 0 0 2px var(--accent-primary);
        }

        .name {
          font-size: 1.5rem;
          letter-spacing: 0.05em;
          text-transform: uppercase;
        }

        .title {
          font-size: 1rem;
          color: var(--accent-secondary);
          font-weight: 500;
        }

        .left-column section h3 {
          font-size: 1.1rem;
          text-transform: uppercase;
          color: var(--accent-primary);
          margin-bottom: 1rem;
          letter-spacing: 0.05em;
          border-bottom: 1px solid var(--border-glass);
          padding-bottom: 0.5rem;
        }

        .contact-info {
          display: flex;
          flex-direction: column;
          gap: 0.75rem;
          font-size: 0.875rem;
        }

        .contact-info a {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          color: var(--text-muted);
        }

        .contact-info a i {
          color: var(--text-main);
          width: 16px;
          text-align: center;
        }

        .entry {
          margin-bottom: 1.5rem;
        }

        .entry h4 {
          font-size: 1rem;
        }

        .entry p {
          font-size: 0.875rem;
          color: var(--text-muted);
        }

        .skills p {
          margin-bottom: 0.5rem;
        }

        .skills strong {
          color: var(--text-main);
          display: block;
        }

        /* Right Column */
        .right-column {
          width: 65%;
          padding: 3rem 2.5rem;
          display: flex;
          flex-direction: column;
          gap: 2.5rem;
        }

        .right-column section h2 {
          font-size: 1.5rem;
          color: var(--accent-secondary);
          border-bottom: 2px solid var(--border-glass);
          padding-bottom: 0.5rem;
          margin-bottom: 1.5rem;
          display: flex;
          align-items: center;
          gap: 0.5rem;
        }

        .summary-section p {
          font-size: 0.95rem;
          color: var(--text-muted);
          margin-bottom: 0.5rem;
        }

        .right-column h3 {
          font-size: 1.125rem;
          margin-bottom: 0.5rem;
        }

        .right-column ul {
          padding-left: 1.2rem;
          margin-top: 0.5rem;
        }

        .right-column li {
          font-size: 0.95rem;
          color: var(--text-muted);
          margin-bottom: 0.4rem;
        }

        .right-column li strong {
          color: var(--text-main);
        }

        /* Buttons */
        .download-btn {
          margin-top: 3rem;
          padding: 1rem 2rem;
          background: var(--text-main);
          color: var(--bg-color);
          border: none;
          border-radius: 99px;
          font-family: 'Inter', sans-serif;
          font-weight: 600;
          font-size: 1rem;
          cursor: pointer;
          display: flex;
          align-items: center;
          gap: 0.5rem;
          transition: transform 0.2s, box-shadow 0.2s;
        }

        .download-btn:hover {
          transform: translateY(-2px);
          box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }

        /* Modal */
        .modal-overlay {
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.8);
          backdrop-filter: blur(5px);
          display: none;
          align-items: center;
          justify-content: center;
          z-index: 1000;
        }

        .modal-content {
          background: var(--bg-surface);
          padding: 2.5rem;
          border-radius: var(--radius-md);
          border: 1px solid var(--border-glass);
          text-align: center;
          position: relative;
          max-width: 400px;
          width: 90%;
        }

        .modal-content h3 {
          margin-bottom: 1rem;
        }

        .modal-content p {
          color: var(--text-muted);
          margin-bottom: 2rem;
          font-size: 0.95rem;
        }

        .modal-buttons {
          display: flex;
          flex-direction: column;
          gap: 1rem;
        }

        .modal-btn {
          padding: 1rem;
          background: rgba(255,255,255,0.05);
          border: 1px solid var(--border-glass);
          border-radius: var(--radius-md);
          color: var(--text-main);
          font-family: inherit;
          font-weight: 600;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 0.5rem;
          transition: all 0.2s;
        }

        .modal-btn:hover {
          background: var(--text-main);
          color: var(--bg-color);
        }

        .close-btn {
          position: absolute;
          top: 1rem;
          right: 1.5rem;
          background: none;
          border: none;
          color: var(--text-muted);
          font-size: 1.5rem;
          cursor: pointer;
        }

        .close-btn:hover {
          color: var(--text-main);
        }

        @media (max-width: 768px) {
          .resume-container {
            flex-direction: column;
          }
          .left-column, .right-column {
            width: 100%;
            border-right: none;
          }
          .left-column {
            border-bottom: 1px solid var(--border-glass);
          }
        }
    </style>
</head>

    <!-- Libraries for generating PDF and Image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('download-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const downloadPngBtn = document.getElementById('download-png-btn');
        const downloadPdfBtn = document.getElementById('download-pdf-btn');
        const resumeContainer = document.getElementById('resume-container');
        const btnText = document.getElementById('btn-text');

        // Show the modal when the main download button is clicked
        downloadBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
        });

        // Hide the modal
        const closeModal = () => {
            modal.style.display = 'none';
        };
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        const showLoadingState = (isloading) => {
            const mainBtnIcon = downloadBtn.querySelector('i');
            if (isloading) {
                btnText.textContent = 'Generating...';
                mainBtnIcon.className = 'fas fa-spinner fa-spin';
                downloadBtn.disabled = true;
                downloadPngBtn.disabled = true;
                downloadPdfBtn.disabled = true;
            } else {
                btnText.textContent = 'Download Resume';
                mainBtnIcon.className = 'fas fa-download';
                downloadBtn.disabled = false;
                downloadPngBtn.disabled = false;
                downloadPdfBtn.disabled = false;
                closeModal();
            }
        };

        const captureResume = () => {
            return html2canvas(resumeContainer, {
                scale: 3,
                useCORS: true,
                logging: false,
                width: resumeContainer.offsetWidth,
                height: resumeContainer.offsetHeight
            });
        };

        // Handle PNG Download
        downloadPngBtn.addEventListener('click', () => {
            showLoadingState(true);
            captureResume().then(canvas => {
                const link = document.createElement('a');
                link.download = 'Aditya-Sharma-Resume.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                showLoadingState(false);
            }).catch(err => {
                showLoadingState(false);
            });
        });

        // Handle PDF Download
        downloadPdfBtn.addEventListener('click', () => {
            showLoadingState(true);
            const { jsPDF } = window.jspdf;
            
            captureResume().then(canvas => {
                const canvasWidth = canvas.width;
                const canvasHeight = canvas.height;
                const A4_RATIO = 1.414; 
                const a4Height = canvasWidth * A4_RATIO;
                
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'px',
                    format: [canvasWidth, a4Height]
                });

                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                
                let yPos = 0;
                let remainingHeight = canvasHeight;
                
                pdf.addImage(canvas, 'PNG', 0, yPos, pdfWidth, canvasHeight);
                remainingHeight -= pdfHeight;

                while (remainingHeight > 0) {
                    pdf.addPage();
                    yPos -= pdfHeight;
                    pdf.addImage(canvas, 'PNG', 0, yPos, pdfWidth, canvasHeight);
                    remainingHeight -= pdfHeight;
                }

                pdf.save('Aditya-Sharma-Resume.pdf');
                showLoadingState(false);
            }).catch(err => {
                showLoadingState(false);
            });
        });

        // -- DATA POPULATION LOGIC --
        const escapeHtml = (value) => String(value || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
        
        window.addEventListener("DOMContentLoaded", async () => {
            const store = window.portfolioStore;
            if(!store) return;
            const data = await store.init();
            
            document.getElementById("resume-name").textContent = data.profile.name;
            document.getElementById("resume-label").textContent = data.profile.label;
            document.getElementById("resume-portrait").src = data.profile.portrait || "profile.png";
            
            const contactHTML = [];
            if(data.profile.email) contactHTML.push(`<a href="mailto:${escapeHtml(data.profile.email)}"><i class="fas fa-envelope"></i> ${escapeHtml(data.profile.email)}</a>`);
            if(data.profile.linkedinUrl) contactHTML.push(`<a href="${escapeHtml(data.profile.linkedinUrl)}" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>`);
            if(data.profile.githubUrl) contactHTML.push(`<a href="${escapeHtml(data.profile.githubUrl)}" target="_blank"><i class="fab fa-github"></i> GitHub</a>`);
            document.getElementById("resume-contact-info").innerHTML = contactHTML.join("");
            
            if (data.profile && data.profile.languages && data.profile.languages.length) {
                document.getElementById("resume-languages").innerHTML = `<p>${escapeHtml(data.profile.languages.join(", "))}</p>`;
            }
            
            document.getElementById("resume-education").innerHTML = (data.journey.education || []).map(e => `
                <div class="entry">
                    <h4>${escapeHtml(e.title)}</h4>
                    <p><em>${escapeHtml(e.place)}</em></p>
                    <p>${escapeHtml(e.year)}</p>
                </div>
            `).join("");
            
            if (data.skills && data.skills.capabilities) {
               document.getElementById("resume-skills").innerHTML = data.skills.capabilities.map(c => `<p><strong>${escapeHtml(c.title)}:</strong> ${escapeHtml(c.text)}</p>`).join("");
            }
            
            document.getElementById("resume-summary").innerHTML = (data.about.paragraphs || []).slice(0, 2).map(p => `<p>${escapeHtml(p)}</p>`).join("");
            
            const projectsToRender = data.projects || [];
            
            document.getElementById("resume-projects").innerHTML = projectsToRender.map(p => `
                <div class="entry">
                    <h3>${escapeHtml(p.title)}</h3>
                    <ul>
                        <li>${escapeHtml(p.description)}</li>
                        ${p.highlight ? `<li>${escapeHtml(p.highlight)}</li>` : ""}
                    </ul>
                </div>
            `).join("");
            
            document.getElementById("resume-achievements").innerHTML = (data.journey.highlights || []).map(h => `<li>${escapeHtml(h)}</li>`).join("");
            document.getElementById("resume-activities").innerHTML = (data.journey.activities || []).map(a => `<li>${escapeHtml(a)}</li>`).join("");
        });
    </script>
