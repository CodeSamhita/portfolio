<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title>Resume - Aditya Sharma</title>
    <link rel="stylesheet" href="resume-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- This is the main container that will be converted to an image/PDF -->
    <div class="resume-container" id="resume-container">
        <aside class="left-column">
            <div class="profile-section">
                <img id="resume-portrait" src="profile.png" alt="Profile" class="resume-profile-img">
                <h1 class="name" id="resume-name"></h1>
                <h2 class="title" id="resume-label"></h2>
            </div>

            <section class="contact-section">
                <h3>Contact</h3>
                <div class="contact-info" id="resume-contact-info"></div>
            </section>

            <section>
                <h3>Languages</h3>
                <div class="entry skills" id="resume-languages"></div>
            </section>

            <section>
                <h3>Education</h3>
                <div id="resume-education"></div>
            </section>

            <section>
                <h3>Skills</h3>
                <div class="entry skills" id="resume-skills"></div>
            </section>
        </aside>

        <main class="right-column">
            <section class="summary-section">
                <h2><i class="fas fa-user-circle"></i> Summary</h2>
                <div id="resume-summary"></div>
            </section>
            
            <section>
                <h2><i class="fas fa-cogs"></i> Key Projects</h2>
                <div id="resume-projects"></div>
            </section>
            
            <section>
                <h2><i class="fas fa-certificate"></i> Certifications & Achievements</h2>
                <div class="entry">
                    <ul id="resume-achievements"></ul>
                </div>
            </section>
            
            <section>
                <h2><i class="fas fa-users"></i> Clubs & Activities</h2>
                <div class="entry">
                    <ul id="resume-activities"></ul>
                </div>
            </section>
        </main>
    </div>

    <!-- Download Modal -->
    <div id="download-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Choose Download Format</h3>
            <p>Select your preferred format to download the resume.</p>
            <div class="modal-buttons">
                <button id="download-png-btn" class="modal-btn"><i class="fas fa-image"></i> Download PNG</button>
                <button id="download-pdf-btn" class="modal-btn"><i class="fas fa-file-pdf"></i> Download PDF</button>
            </div>
            <button id="close-modal-btn" class="close-btn">&times;</button>
        </div>
    </div>

    <button id="downloadBtn" class="download-btn">
        <i class="fas fa-download"></i> <span id="btn-text">Download Resume</span>
    </button>

    <!-- Data Logic -->
    <script src="data-store.js"></script>

    <!-- Libraries for generating PDF and Image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('download-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const downloadPngBtn = document.getElementById('download-png-btn');
        const downloadPdfBtn = document.getElementById('download-pdf-btn');
        const resumeContainer = document.getElementById('resume-container');
        const btnText = document.getElementById('btn-text');

        // Show the modal when the main download button is clicked
        downloadBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
        });

        // Hide the modal
        const closeModal = () => {
            modal.style.display = 'none';
        };
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        const showLoadingState = (isloading) => {
            const mainBtnIcon = downloadBtn.querySelector('i');
            if (isloading) {
                btnText.textContent = 'Generating...';
                mainBtnIcon.className = 'fas fa-spinner fa-spin';
                downloadBtn.disabled = true;
                downloadPngBtn.disabled = true;
                downloadPdfBtn.disabled = true;
            } else {
                btnText.textContent = 'Download Resume';
                mainBtnIcon.className = 'fas fa-download';
                downloadBtn.disabled = false;
                downloadPngBtn.disabled = false;
                downloadPdfBtn.disabled = false;
                closeModal();
            }
        };

        const captureResume = () => {
            return html2canvas(resumeContainer, {
                scale: 3,
                useCORS: true,
                logging: false,
                width: resumeContainer.offsetWidth,
                height: resumeContainer.offsetHeight
            });
        };

        // Handle PNG Download
        downloadPngBtn.addEventListener('click', () => {
            showLoadingState(true);
            captureResume().then(canvas => {
                const link = document.createElement('a');
                link.download = 'Aditya-Sharma-Resume.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                showLoadingState(false);
            }).catch(err => {
                showLoadingState(false);
            });
        });

        // Handle PDF Download
        downloadPdfBtn.addEventListener('click', () => {
            showLoadingState(true);
            const { jsPDF } = window.jspdf;
            
            captureResume().then(canvas => {
                const canvasWidth = canvas.width;
                const canvasHeight = canvas.height;
                const A4_RATIO = 1.414; 
                const a4Height = canvasWidth * A4_RATIO;
                
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'px',
                    format: [canvasWidth, a4Height]
                });

                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                
                let yPos = 0;
                let remainingHeight = canvasHeight;
                
                pdf.addImage(canvas, 'PNG', 0, yPos, pdfWidth, canvasHeight);
                remainingHeight -= pdfHeight;

                while (remainingHeight > 0) {
                    pdf.addPage();
                    yPos -= pdfHeight;
                    pdf.addImage(canvas, 'PNG', 0, yPos, pdfWidth, canvasHeight);
                    remainingHeight -= pdfHeight;
                }

                pdf.save('Aditya-Sharma-Resume.pdf');
                showLoadingState(false);
            }).catch(err => {
                showLoadingState(false);
            });
        });

        // -- DATA POPULATION LOGIC --
        const escapeHtml = (value) => String(value || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
        
        window.addEventListener("DOMContentLoaded", async () => {
            const store = window.portfolioStore;
            if(!store) return;
            const data = await store.init();
            
            document.getElementById("resume-name").textContent = data.profile.name;
            document.getElementById("resume-label").textContent = data.profile.label;
            document.getElementById("resume-portrait").src = data.profile.portrait || "profile.png";
            
            const contactHTML = [];
            if(data.profile.email) contactHTML.push(`<a href="mailto:${escapeHtml(data.profile.email)}"><i class="fas fa-envelope"></i> ${escapeHtml(data.profile.email)}</a>`);
            if(data.profile.linkedinUrl) contactHTML.push(`<a href="${escapeHtml(data.profile.linkedinUrl)}" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>`);
            if(data.profile.githubUrl) contactHTML.push(`<a href="${escapeHtml(data.profile.githubUrl)}" target="_blank"><i class="fab fa-github"></i> GitHub</a>`);
            contactHTML.push(`<a href="index.html" target="_blank"><i class="fas fa-globe"></i> Portfolio</a>`);
            document.getElementById("resume-contact-info").innerHTML = contactHTML.join("");
            
            if (data.profile && data.profile.languages && data.profile.languages.length) {
                document.getElementById("resume-languages").innerHTML = `<p>${escapeHtml(data.profile.languages.join(", "))}</p>`;
            }
            
            document.getElementById("resume-education").innerHTML = (data.journey.education || []).map(e => `
                <div class="entry">
                    <h4>${escapeHtml(e.title)}</h4>
                    <p><em>${escapeHtml(e.place)}</em></p>
                    <p>${escapeHtml(e.year)}</p>
                </div>
            `).join("");
            
            if (data.skills && data.skills.capabilities) {
               document.getElementById("resume-skills").innerHTML = data.skills.capabilities.map(c => `<p><strong>${escapeHtml(c.title)}:</strong> ${escapeHtml(c.text)}</p>`).join("");
            }
            
            document.getElementById("resume-summary").innerHTML = (data.about.paragraphs || []).slice(0, 2).map(p => `<p>${escapeHtml(p)}</p>`).join("");
            
            const topProjects = (data.projects || []).filter(p => p.featured).slice(0, 3);
            const fallbackProjects = (data.projects || []).slice(0, 3);
            const projectsToRender = topProjects.length ? topProjects : fallbackProjects;
            
            document.getElementById("resume-projects").innerHTML = projectsToRender.map(p => `
                <div class="entry">
                    <h3>${escapeHtml(p.title)}</h3>
                    <ul>
                        <li>${escapeHtml(p.description)}</li>
                        ${p.highlight ? `<li>${escapeHtml(p.highlight)}</li>` : ""}
                    </ul>
                </div>
            `).join("");
            
            document.getElementById("resume-achievements").innerHTML = (data.journey.highlights || []).map(h => `<li>${escapeHtml(h)}</li>`).join("");
            document.getElementById("resume-activities").innerHTML = (data.journey.activities || []).map(a => `<li>${escapeHtml(a)}</li>`).join("");
        });
    </script>
</body>
</html>
