<!DOCTYPE html>
<html lang="en-IN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aditya Sharma — Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="nav scrolled" id="nav">
    <a href="index.html" class="nav-logo" id="nav-logo" aria-label="Home"></a>
    <div class="nav-actions">
      <button class="theme-toggle hint-left" id="theme-toggle" aria-label="Toggle theme" data-hint="Switch light / dark"><i class="fas fa-moon"></i></button>
      <a class="btn btn-ghost" href="index.html"><i class="fas fa-arrow-left"></i> Back to site</a>
    </div>
  </header>

  <main id="app">
    <section class="section reveal" style="padding-top:7rem">
      <div class="section-head" id="gallery-head"></div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous">&#8249;</button>
    <img class="lightbox-img" id="lightbox-img" alt="" />
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next">&#8250;</button>
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
