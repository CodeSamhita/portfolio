<!DOCTYPE html>
<html lang="en-IN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aditya Sharma — Résumé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root { --ink:#16161a; --muted:#55555f; --line:#e3e1da; --accent:#ff6a3d; --paper:#ffffff; --bg:#ece9e3; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:"Inter",system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; padding:clamp(1rem,4vw,2.5rem) 1rem; }
    .toolbar { max-width:50rem; margin:0 auto 1.2rem; display:flex; gap:0.6rem; justify-content:flex-end; }
    .btn { font-family:"Inter",sans-serif; font-weight:600; font-size:0.85rem; padding:0.6rem 1.1rem; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; display:inline-flex; gap:0.5rem; align-items:center; text-decoration:none; transition:transform .2s ease, box-shadow .25s ease; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 0.5rem 1rem -0.5rem rgba(0,0,0,0.25); }
    .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .page {
      max-width:50rem; margin:0 auto; background:var(--paper); color:var(--ink);
      padding:clamp(1.6rem,5vw,3rem); border-radius:0.5rem;
      box-shadow:0 1.6rem 3rem -1.2rem rgba(40,30,20,0.3);
    }
    h1 { font-family:"Bricolage Grotesque",sans-serif; font-size:clamp(1.8rem,5vw,2.4rem); letter-spacing:0.02em; }
    .role { color:var(--accent); font-weight:600; font-size:0.98rem; margin-top:0.15rem; }
    .contact { display:flex; flex-wrap:wrap; gap:0.4rem 1rem; margin-top:0.7rem; font-size:0.82rem; color:var(--muted); }
    .contact a { color:var(--muted); text-decoration:none; }
    .contact a:hover { color:var(--accent); }
    h2 { font-family:"Bricolage Grotesque",sans-serif; font-size:0.92rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); margin:1.5rem 0 0.6rem; padding-bottom:0.3rem; border-bottom:2px solid var(--line); }
    .item { margin-bottom:0.8rem; }
    .item .row { display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .item .t { font-weight:700; font-size:0.96rem; }
    .item .meta { color:var(--muted); font-size:0.82rem; white-space:nowrap; }
    .item .sub { color:var(--muted); font-size:0.86rem; }
    ul { list-style:none; margin-top:0.3rem; }
    ul li { position:relative; padding-left:1rem; font-size:0.88rem; margin-bottom:0.22rem; }
    ul li::before { content:""; position:absolute; left:0; top:0.5rem; width:0.34rem; height:0.34rem; border-radius:50%; background:var(--accent); }
    .skills-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem 1.4rem; }
    .skill-row { font-size:0.86rem; }
    .skill-row b { font-weight:700; }
    .tags { font-size:0.82rem; color:var(--muted); margin-top:0.15rem; }
    .obj { font-size:0.92rem; color:#33333a; }
    @media (max-width:520px){ .skills-grid{grid-template-columns:1fr;} .item .meta{white-space:normal;} }
    @media print {
      body { background:#fff; padding:0; }
      .toolbar { display:none; }
      .page { box-shadow:none; max-width:100%; border-radius:0; padding:0.4in; }
      h2 { margin-top:0.9rem; }
      a { color:inherit; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="index.html" class="btn"><i class="fas fa-arrow-left"></i> Back to site</a>
    <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-download"></i> Download / Print</button>
  </div>
  <article class="page" id="resume">
    <p style="font-family:monospace;color:#999">Loading résumé…</p>
  </article>
  <script src="resume.js"></script>
</body>
</html>
